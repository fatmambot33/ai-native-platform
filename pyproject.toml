[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-platform"
version = "0.1.0"
description = "Evidence-backed standard and validator for first-class AI-native repositories"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "fatmambot33"}]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "tomli>=2.0,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
ai-native = "ai_native:main"

[tool.setuptools]
py-modules = ["ai_native"]

[tool.setuptools.data-files]
"share/ai-native-platform" = [
  "schemas/ai-native-platform.schema.json",
  "templates/AI_NATIVE_PLATFORM.yaml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"ai_native.py" = ["E501"]
"tools/improvement_engine.py" = ["E402"]
