name: Codex current-HEAD review gate
description: Request or require Codex review evidence for a pull-request HEAD.

inputs:
  token:
    description: GitHub token. Request mode needs issues:write; reporting needs checks:write.
    required: true
  pr-number:
    description: Pull request number.
    required: true
  head-sha:
    description: Current pull request HEAD SHA.
    required: true
  review-context:
    description: Optional context key, such as the base SHA, that requires fresh review evidence for the same HEAD.
    required: false
    default: ""
  mode:
    description: One of request, wait, or request-and-wait.
    required: false
    default: wait
  check-name:
    description: Optional check-run name to publish directly on the pull-request HEAD. Intended for trusted pull_request_target workflows with checks:write.
    required: false
    default: ""
  timeout-seconds:
    description: Maximum time to wait for Codex.
    required: false
    default: "1800"
  poll-seconds:
    description: Poll interval while waiting for Codex.
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - name: Run Codex current-HEAD review gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        CODEX_REVIEW_CONTEXT: ${{ inputs.review-context }}
        CODEX_REVIEW_MODE: ${{ inputs.mode }}
        CODEX_REVIEW_CHECK_NAME: ${{ inputs.check-name }}
        CODEX_REVIEW_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        CODEX_REVIEW_POLL_SECONDS: ${{ inputs.poll-seconds }}
      run: bash "$GITHUB_ACTION_PATH/codex-review-gate.sh"
