version: 1
standard:
  name: First-Class AI-Native Platform
  repository: fatmambot33/ai-native-platform
  lifecycle: prerelease
  versioning: semver
  current_release: 0.2.0

product_model:
  contract: schemas/ai-native-platform.schema.json
  evidence_mode: repository
  unknown_fields: forbidden
  extensions_field: extensions

profiles:
  library:
    required_interfaces: [sdk, json_schema]
  cli:
    required_interfaces: [cli, json_schema]
  service:
    required_any_interfaces: [openapi, sdk]
    required_interfaces: [json_schema]
  agent-tool:
    required_any_interfaces: [plugin, mcp]
    required_interfaces: [json_schema]
  plugin:
    required_interfaces: [plugin, json_schema]
  full-platform:
    required_interfaces: [sdk, cli, plugin, json_schema]

principles:
  - schema_first
  - evidence_backed
  - deterministic_interfaces
  - structured_outputs
  - local_credentials
  - least_privilege
  - governed_autonomy
  - backward_compatible_evolution
  - single_source_of_truth

required_agent_guarantees:
  - deterministic_tool_discovery
  - structured_outputs
  - issue_driven_improvement
  - ci_validated_changes
  - governed_autonomy

governance:
  ai_review:
    provider: codex
    current_head_required: true
    review_thread_resolution_required: true
    human_approval_required: false
    request_while_ci_runs: true
    reference_action: actions/codex-review-gate
  human_approval_required:
    - breaking_changes
    - security_changes
    - credential_changes
    - public_api_changes
    - permission_expansion
    - release_changes
  safe_auto_merge_allowed:
    - documentation
    - tests
    - formatting
    - examples
    - non_breaking_maintenance

release_gates:
  - schema_valid
  - semantic_validation_passes
  - repository_evidence_exists
  - tests_pass
  - documentation_current
  - changelog_current
  - migration_notes_for_breaking_changes
  - ai_review_current_head
  - review_threads_resolved
