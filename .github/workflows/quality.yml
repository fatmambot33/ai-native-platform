name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python validator/validate_standard.py
      - run: python -m build
      - name: Wheel installation smoke test
        shell: bash
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .smoke-venv/bin/ai-native --version
          .smoke-venv/bin/ai-native init /tmp/AI_NATIVE_PLATFORM.yaml
