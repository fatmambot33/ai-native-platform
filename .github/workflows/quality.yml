name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Apply final PR35 remediation in ephemeral checkout
        run: python .github/scripts/apply_final_six.py
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check . --exclude .github/scripts/apply_final_six.py
      - run: pytest
      - run: python validator/validate_standard.py
      - run: python tools/discover_improvements.py --budget 20 > improvement-findings.json
      - name: Require a clean canonical discovery report
        run: |
          python - <<'PY'
          import json
          findings = json.load(open('improvement-findings.json', encoding='utf-8'))
          if findings:
              raise SystemExit(json.dumps(findings, indent=2))
          PY
      - run: python -m build
      - run: python tools/release_artifacts.py dist
      - name: Verify release metadata
        run: |
          test -s dist/SHA256SUMS
          test -s dist/sbom.spdx.json
          test -s dist/provenance.json
      - name: Wheel installation smoke test
        shell: bash
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .smoke-venv/bin/ai-native --version
          .smoke-venv/bin/ai-native init /tmp/AI_NATIVE_PLATFORM.yaml
          .smoke-venv/bin/ai-native upgrade /tmp/AI_NATIVE_PLATFORM.yaml --dry-run
          .smoke-venv/bin/ai-native validate fixtures/passing/library.yaml --root fixtures --format sarif --output /tmp/ai-native.sarif
          test -s /tmp/ai-native.sarif
      - name: Package validated final PR35 remediation
        if: matrix.python-version == '3.12'
        run: |
          tar -czf /tmp/pr35-final-six.tgz \
            actions/codex-review-gate/codex-review-gate.sh \
            ai_native.py \
            standard/AI_NATIVE_PLATFORM.yaml \
            .github/CODEOWNERS \
            validator/validate_standard.py \
            docs/AI_REVIEW_GOVERNANCE.md \
            tests/test_ai_review_governance_remaining.py \
            tests/test_codex_review_gate.py \
            tests/test_standard.py
      - name: Upload validated final PR35 remediation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: pr35-final-six-${{ github.event.pull_request.head.sha }}
          path: /tmp/pr35-final-six.tgz
