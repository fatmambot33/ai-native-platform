name: Format governance regression tests

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/format-governance-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: align/codex-governance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff<1,>=0.12'
      - run: |
          ruff format tests/test_ai_review_governance_hardening.py
          ruff check --fix tests/test_ai_review_governance_hardening.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_ai_review_governance_hardening.py
          git diff --cached --quiet || git commit -m "style: format governance regression tests"
          git push origin HEAD:align/codex-governance
