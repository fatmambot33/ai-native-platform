name: Validate AI-native platform

on:
  workflow_call:
    inputs:
      manifest:
        description: Product manifest path
        required: false
        type: string
        default: AI_NATIVE_PLATFORM.yaml
      standard_ref:
        description: Exact standard release or immutable commit
        required: false
        type: string
        default: v0.2.0
    secrets:
      standard_token:
        description: Optional token with read access when the standard repository is private
        required: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-standard:
    if: github.repository == 'fatmambot33/ai-native-platform'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request Codex review of current HEAD
        if: github.event_name == 'pull_request'
        uses: ./actions/codex-review-gate
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}
          request-only: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate canonical standard
        run: python validator/validate_standard.py
      - name: Require Codex review of current HEAD
        if: github.event_name == 'pull_request'
        uses: ./actions/codex-review-gate
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}

  validate-product:
    if: github.repository != 'fatmambot33/ai-native-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical validator
        uses: actions/checkout@v4
        with:
          repository: fatmambot33/ai-native-platform
          ref: ${{ inputs.standard_ref }}
          path: .ai-native-standard
          token: ${{ secrets.standard_token || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check ./.ai-native-standard
      - name: Validate product contract and evidence
        run: ai-native validate "${{ inputs.manifest }}" --root .
