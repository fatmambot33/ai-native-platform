name: Resolve remaining Codex governance findings

on:
  push:
    branches: [align/codex-governance]

permissions:
  contents: write

concurrency:
  group: resolve-codex-governance-findings
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply remaining governance fixes
        run: python .github/scripts/tmp_resolve_codex_findings.py

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Validate canonical standard
        run: python validator/validate_standard.py

      - name: Validate consumer fixture
        run: >-
          python -m ai_native validate
          fixtures/consumer-repository/AI_NATIVE_PLATFORM.yaml
          --root fixtures/consumer-repository

      - name: Validate shell gate
        run: bash -n actions/codex-review-gate/codex-review-gate.sh

      - name: Build
        run: python -m build

      - name: Check diff
        run: git diff --check

      - name: Commit validated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows/tmp-resolve-codex-findings.yml'
          git commit -m "fix: close remaining Codex governance gaps"
          git push origin HEAD:align/codex-governance
