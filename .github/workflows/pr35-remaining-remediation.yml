name: PR35 remaining remediation

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/scripts/apply_pr35_remaining_findings.py

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - run: python .github/scripts/apply_pr35_remaining_findings.py
      - run: ruff check .
      - run: pytest
      - run: python validator/validate_standard.py
      - run: python -m ai_native validate fixtures/passing/library.yaml --root fixtures --format json
      - run: bash -n actions/codex-review-gate/preflight.sh actions/codex-review-gate/codex-review-gate.sh
      - run: python -m build
      - run: git diff --check
      - name: Commit remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_native.py validator/validate_standard.py actions/codex-review-gate/preflight.sh tests/test_pr35_final_governance.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: close remaining Codex governance findings"
          git push origin HEAD:align/codex-governance
