name: Prepare immutable PR35 gate pin

on:
  push:
    branches: [maintenance/pr35-pin]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/pr35-pin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Pin trusted gate in code, workflow, and fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = '02d16e85b80b8631fdca011a6a73e7c703d1d507'
          old = '48f0c6c4351a040f3214ef01e036b5f00032b2cd'

          core = Path('ai_native.py')
          text = core.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'ai_native trusted ref matches: {text.count(old)}')
          core.write_text(text.replace(old, target), encoding='utf-8')

          workflow = Path('.github/workflows/codex-review.yml')
          text = workflow.read_text(encoding='utf-8')
          if text.count(old) != 2:
              raise SystemExit(f'workflow gate pin matches: {text.count(old)}')
          workflow.write_text(text.replace(old, target), encoding='utf-8')

          for path in Path('tests').glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, target), encoding='utf-8')

          regression = Path('tests/test_pr35_final_governance.py')
          with regression.open('a', encoding='utf-8') as handle:
              handle.write(f'''\n\ndef test_trusted_gate_ref_is_finalized_core_commit() -> None:\n    assert ai_native.TRUSTED_AI_REVIEW_GATE_REFS == frozenset({{"{target}"}})\n''')
          PY
      - run: |
          ruff format tests/test_pr35_final_governance.py
          ruff check .
          pytest
          python validator/validate_standard.py
          git diff --check
      - name: Commit only non-workflow pin files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_native.py tests
          git commit -m 'chore: trust finalized Codex gate revision'
          git push origin HEAD:maintenance/pr35-pin
