name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python validator/validate_standard.py
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          expected = f'v{version}'
          actual = os.environ['GITHUB_REF_NAME']
          if actual != expected:
              raise SystemExit(f'tag {actual!r} must equal {expected!r}')
          PY
      - run: python -m build
      - run: python tools/release_artifacts.py dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.spdx.json
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
