name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ai-native-platform-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  consumers:
    uses: ./.github/workflows/consumer-conformance.yml

  release:
    needs: consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Determine idempotent release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          PY
          )
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            tagged_commit=$(git rev-parse "$tag^{commit}")
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "Existing tag $tag points to $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Install release dependencies
        if: steps.state.outputs.publish == 'true'
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run release gates
        if: steps.state.outputs.publish == 'true'
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
          python tools/discover_improvements.py --budget 20 > improvement-findings.json
          python - <<'PY'
          import json
          findings = json.load(open('improvement-findings.json', encoding='utf-8'))
          if findings:
              raise SystemExit(f'Unresolved release findings: {findings}')
          PY
      - name: Build verifiable release artifacts
        if: steps.state.outputs.publish == 'true'
        run: |
          python -m build
          python tools/release_artifacts.py dist
          sha256sum --check dist/SHA256SUMS
      - name: Attest release artifacts
        if: steps.state.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.spdx.json
      - name: Create immutable release tag
        if: steps.state.outputs.publish == 'true' && steps.state.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m "AI Native Platform $TAG"
          git push origin "refs/tags/$TAG"
      - name: Publish immutable GitHub prerelease
        if: steps.state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --verify-tag
