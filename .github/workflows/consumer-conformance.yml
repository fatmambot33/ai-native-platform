name: Consumer conformance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
      standard_ref: ${{ steps.registry.outputs.standard_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - id: registry
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import yaml
          registry = yaml.safe_load(open('consumers/registry.yaml', encoding='utf-8'))
          print('matrix=' + json.dumps({'include': registry['consumers']}, separators=(',', ':')))
          print('standard_ref=' + registry['standard_ref'])
          PY

  validate:
    needs: registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.registry.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standard
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install conformance CLI
        run: python -m pip install --disable-pip-version-check .
      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: consumer
      - name: Validate consumer contract and evidence
        run: ai-native validate "consumer/${{ matrix.manifest }}" --root consumer --format json
      - name: Verify registry identity and immutable standard pin
        env:
          EXPECTED_PROFILE: ${{ matrix.profile }}
          EXPECTED_STANDARD_REF: ${{ needs.registry.outputs.standard_ref }}
          MANIFEST: consumer/${{ matrix.manifest }}
        run: |
          python - <<'PY'
          import os
          import yaml
          manifest = yaml.safe_load(open(os.environ['MANIFEST'], encoding='utf-8'))
          actual_profile = manifest['product']['profile']
          actual_ref = manifest['standard']['ref']
          if actual_profile != os.environ['EXPECTED_PROFILE']:
              raise SystemExit(f'profile {actual_profile!r} != {os.environ["EXPECTED_PROFILE"]!r}')
          if actual_ref != os.environ['EXPECTED_STANDARD_REF']:
              raise SystemExit(f'standard ref {actual_ref!r} != {os.environ["EXPECTED_STANDARD_REF"]!r}')
          PY

  consumer-conformance:
    needs: [registry, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every consumer conformance job to pass
        env:
          REGISTRY_RESULT: ${{ needs.registry.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          test "$REGISTRY_RESULT" = success
          test "$VALIDATE_RESULT" = success
