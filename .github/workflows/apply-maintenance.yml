name: Apply maintenance remediation

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/apply-maintenance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Apply deterministic governance fixes
        run: |
          python .github/scripts/apply_governance_fixes.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_validation.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_ai_review_workflow_accepts_multiple_paths(tmp_path: Path) -> None:\n    data = _template()\n    _enable_ai_review(\n        data,\n        [\n            ".github/workflows/codex-review.yml",\n            ".github/workflows/codex-review-secondary.yml",\n        ],\n    )\n    manifest = tmp_path / "AI_NATIVE_PLATFORM.yaml"\n    manifest.write_text(yaml.safe_dump(data, sort_keys=False), encoding="utf-8")\n    _materialize_evidence(tmp_path, data)\n\n    _, findings = validate_manifest(manifest, tmp_path)\n\n    assert findings == []\n'''
          new = '''def test_ai_review_workflow_rejects_multiple_paths(tmp_path: Path) -> None:\n    data = _template()\n    _enable_ai_review(\n        data,\n        [\n            ".github/workflows/codex-review.yml",\n            ".github/workflows/codex-review-secondary.yml",\n        ],\n    )\n    manifest = tmp_path / "AI_NATIVE_PLATFORM.yaml"\n    manifest.write_text(yaml.safe_dump(data, sort_keys=False), encoding="utf-8")\n    _materialize_evidence(tmp_path, data)\n\n    _, findings = validate_manifest(manifest, tmp_path)\n\n    assert any(\n        finding.code == "schema.invalid"\n        and finding.path == "evidence.paths.ai_review_workflow"\n        for finding in findings\n    )\n'''
          if text.count(old) != 1:
              raise RuntimeError('expected exactly one obsolete multiple-workflow test')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate remediated tree
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
      - name: Export validated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_native.py schemas/ai-native-platform.schema.json validator/validate_standard.py tests/test_validation.py
          git commit -m "fix: close final AI review governance gaps"
          git push --force origin HEAD:maintenance/pr35-validated
