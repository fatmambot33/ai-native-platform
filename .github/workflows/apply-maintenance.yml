name: Apply maintenance remediation

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/apply-maintenance.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Apply deterministic governance fixes
        run: python .github/scripts/apply_governance_fixes.py
      - name: Validate remediated tree
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-remediation
          path: |
            ai_native.py
            schemas/ai-native-platform.schema.json
            validator/validate_standard.py
          if-no-files-found: error
