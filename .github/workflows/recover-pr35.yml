name: Recover PR35 governance fixes

on:
  push:
    branches: [align/codex-governance]
    paths: [.github/workflows/recover-pr35.yml]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Harden reusable Codex gate core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("actions/codex-review-gate/codex-review-gate.sh")
          text = path.read_text(encoding="utf-8")

          def replace_function(source: str, name: str, body: str) -> str:
              start = source.index(f"{name}() {{")
              end = source.index("\n}\n", start) + 3
              return source[:start] + body.rstrip() + "\n" + source[end:]

          text = replace_function(text, "has_matching_review", r'''has_matching_review() {
            local reviews status
            if ! find_trigger_comment; then
              return 2
            fi
            [[ -n "$COMMENT_ID" && -n "$COMMENT_CREATED_AT" ]] || return 1
            if ! reviews="$(api_list "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then
              echo "::error::Unable to query Codex reviews for marker-backed evidence."
              return 2
            fi
            if jq -e \
              --arg head "$HEAD_SHA" \
              --arg since "$COMMENT_CREATED_AT" \
              "any(.[]; (${is_codex_login}) and ((.state // \"\") != \"DISMISSED\") and ((.commit_id // \"\") == \$head) and ((.submitted_at // \"\") >= \$since))" \
              <<<"$reviews" >/dev/null; then
              return 0
            else
              status=$?
            fi
            [[ "$status" -eq 1 ]] && return 1
            echo "::error::Unable to evaluate Codex review evidence."
            return 2
          }''')

          text = replace_function(text, "has_dismissed_matching_review", r'''has_dismissed_matching_review() {
            local reviews status
            if ! find_trigger_comment; then
              return 2
            fi
            [[ -n "$COMMENT_ID" && -n "$COMMENT_CREATED_AT" ]] || return 1
            if ! reviews="$(api_list "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then
              echo "::error::Unable to query dismissed Codex reviews."
              return 2
            fi
            if jq -e \
              --arg head "$HEAD_SHA" \
              --arg since "$COMMENT_CREATED_AT" \
              "any(.[]; (${is_codex_login}) and ((.state // \"\") == \"DISMISSED\") and ((.commit_id // \"\") == \$head) and ((.submitted_at // \"\") >= \$since))" \
              <<<"$reviews" >/dev/null; then
              return 0
            else
              status=$?
            fi
            [[ "$status" -eq 1 ]] && return 1
            echo "::error::Unable to evaluate dismissed Codex review evidence."
            return 2
          }''')

          text = replace_function(text, "has_trigger_clean_reaction", r'''has_trigger_clean_reaction() {
            local dismissal_status reactions status
            COMMENT_ID=""
            COMMENT_CREATED_AT=""
            if ! find_bot_trigger_comment; then
              return 2
            fi
            [[ -n "$COMMENT_ID" ]] || return 1
            if has_dismissed_matching_review; then
              return 1
            else
              dismissal_status=$?
            fi
            if [[ "$dismissal_status" -ne 1 ]]; then
              echo "::error::Unable to prove marker-backed review evidence is not dismissed."
              return 2
            fi
            if ! reactions="$(api_list "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions?per_page=100")"; then
              echo "::error::Unable to query Codex request-comment reactions."
              return 2
            fi
            if jq -e \
              "any(.[]; (${is_codex_login}) and .content == \"+1\")" \
              <<<"$reactions" >/dev/null; then
              return 0
            else
              status=$?
            fi
            [[ "$status" -eq 1 ]] && return 1
            return 2
          }''')

          text = replace_function(text, "has_native_matching_review", r'''has_native_matching_review() {
            local since="$1"
            local reviews status
            if ! reviews="$(api_list "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then
              echo "::error::Unable to query native Codex reviews."
              return 2
            fi
            if jq -e \
              --arg head "$HEAD_SHA" \
              --arg since "$since" \
              "any(.[]; (${is_codex_login}) and ((.state // \"\") != \"DISMISSED\") and ((.commit_id // \"\") == \$head) and ((.submitted_at // \"\") >= \$since))" \
              <<<"$reviews" >/dev/null; then
              return 0
            else
              status=$?
            fi
            [[ "$status" -eq 1 ]] && return 1
            return 2
          }''')

          text = replace_function(text, "has_any_native_matching_review", r'''has_any_native_matching_review() {
            has_native_matching_review ""
          }''')

          text = replace_function(text, "has_native_clean_reaction", r'''has_native_clean_reaction() {
            local since="$1"
            local reactions status
            if ! reactions="$(api_list "repos/${REPO}/issues/${PR_NUMBER}/reactions?per_page=100")"; then
              echo "::error::Unable to query native Codex reactions."
              return 2
            fi
            if jq -e \
              --arg since "$since" \
              "any(.[]; (${is_codex_login}) and .content == \"+1\" and ((.created_at // \"\") >= \$since))" \
              <<<"$reactions" >/dev/null; then
              return 0
            else
              status=$?
            fi
            [[ "$status" -eq 1 ]] && return 1
            return 2
          }''')

          anchor = '''current_run_created_at() {
            local run
            if ! run="$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}")"; then
              echo "::error::Unable to load the current governance workflow run."
              return 2
            fi
            jq -er '.created_at' <<<"$run" || {
              echo "::error::Current governance run is missing its server timestamp."
              return 2
            }
          }
          '''
          assert anchor in text
          helpers = r'''
          revision_runs() {
            local workflow_id runs
            if ! workflow_id="$(current_workflow_id)"; then
              return 2
            fi
            if ! runs="$(
              gh api --paginate \
                -H "Accept: application/vnd.github+json" \
                "repos/${REPO}/actions/workflows/${workflow_id}/runs?per_page=100" \
                --jq '.workflow_runs[]' | jq -s '.'
            )"; then
              echo "::error::Unable to query governance workflow runs for the current revision."
              return 2
            fi
            jq -c \
              --arg workflow_id "$workflow_id" \
              --arg workflow_path "$WORKFLOW_PATH" \
              --arg head "$HEAD_SHA" \
              --arg base "$BASE_SHA" \
              --argjson pr "$PR_NUMBER" \
              '[.[] | select(
                (.workflow_id | tostring) == $workflow_id
                and .path == $workflow_path
                and any(.pull_requests[]?; .number == $pr and (.head.sha // "") == $head and (.base.sha // "") == $base)
              )]' \
              <<<"$runs"
          }

          revision_activation_created_at() {
            local runs created_at
            if ! runs="$(revision_runs)"; then
              return 2
            fi
            created_at="$(jq -r '[.[] | (.created_at // empty)] | min // ""' <<<"$runs")"
            [[ -n "$created_at" ]] || return 1
            printf '%s\n' "$created_at"
          }

          has_trusted_native_review_run() {
            local runs status
            if ! runs="$(revision_runs)"; then
              return 2
            fi
            if jq -e \
              'any(.[];
                .event == "pull_request_review"
                and (
                  (.actor.login // "") == "chatgpt-codex-connector"
                  or (.actor.login // "") == "chatgpt-codex-connector[bot]"
                )
              )' \
              <<<"$runs" >/dev/null; then
              return 0
            else
              status=$?
            fi
            [[ "$status" -eq 1 ]] && return 1
            return 2
          }
          '''
          text = text.replace(anchor, anchor + helpers, 1)

          text = replace_function(text, "has_any_native_clear_codex_evidence", r'''has_any_native_clear_codex_evidence() {
            local activation activation_status thread_status run_status review_status reaction_status
            if activation="$(revision_activation_created_at)"; then
              :
            else
              activation_status=$?
              [[ "$activation_status" -eq 1 ]] && return 1
              return 2
            fi

            if has_unresolved_codex_threads; then
              echo "Native Codex evidence exists for current HEAD ${SHORT_SHA}, but unresolved Codex review threads remain."
              return 1
            else
              thread_status=$?
            fi
            if [[ "$thread_status" -ne 1 ]]; then
              echo "::error::Unable to prove that all Codex review threads are resolved for current HEAD ${SHORT_SHA}."
              return 2
            fi

            if has_trusted_native_review_run; then
              if has_native_matching_review "$activation"; then
                return 0
              else
                review_status=$?
              fi
              [[ "$review_status" -eq 1 ]] || return 2
            else
              run_status=$?
              [[ "$run_status" -eq 1 ]] || return 2
            fi

            if has_native_clean_reaction "$activation"; then
              return 0
            else
              reaction_status=$?
            fi
            [[ "$reaction_status" -eq 1 ]] && return 1
            return 2
          }''')

          text = replace_function(text, "has_native_clear_codex_evidence", r'''has_native_clear_codex_evidence() {
            local since="$1"
            : "$since"
            has_any_native_clear_codex_evidence
          }''')

          text = replace_function(text, "has_clear_codex_evidence", r'''has_clear_codex_evidence() {
            local review_status reaction_status thread_status
            if has_matching_review; then
              :
            else
              review_status=$?
              if [[ "$review_status" -eq 2 ]]; then
                return 2
              fi
              if has_trigger_clean_reaction; then
                :
              else
                reaction_status=$?
                [[ "$reaction_status" -eq 1 ]] && return 1
                return 2
              fi
            fi
            if has_unresolved_codex_threads; then
              echo "Codex evidence exists for current HEAD ${SHORT_SHA}, but unresolved Codex review threads remain."
              return 1
            else
              thread_status=$?
            fi
            if [[ "$thread_status" -eq 1 ]]; then
              return 0
            fi
            echo "::error::Unable to prove that all Codex review threads are resolved for current HEAD ${SHORT_SHA}."
            return 2
          }''')

          old = '''request_review() {
            if has_any_native_clear_codex_evidence; then
              echo "Reusing completed native Codex review for current HEAD ${SHORT_SHA}; no fallback request needed."
              return 0
            fi
          '''
          new = '''request_review() {
            local native_status
            if has_any_native_clear_codex_evidence; then
              echo "Reusing completed native Codex review for current HEAD ${SHORT_SHA}; no fallback request needed."
              return 0
            else
              native_status=$?
            fi
            [[ "$native_status" -eq 1 ]] || return 2
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''if has_any_native_clear_codex_evidence; then
            echo "Reusing completed native Codex review for current HEAD ${SHORT_SHA}."
            complete_status success
            exit 0
          fi
          '''
          new = '''if has_any_native_clear_codex_evidence; then
            echo "Reusing completed native Codex review for current HEAD ${SHORT_SHA}."
            complete_status success
            exit 0
          else
            native_status=$?
            if [[ "$native_status" -eq 2 ]]; then
              exit 2
            fi
          fi
          '''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          bash -n actions/codex-review-gate/codex-review-gate.sh
          git add actions/codex-review-gate/codex-review-gate.sh
          git commit -m "fix: preserve base-bound Codex evidence"
          echo "CORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Align workflow, validation, ownership and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          core = os.environ["CORE_SHA"]
          old_ref = "7bcc9fc17e6b4859870ca5c3c1aa599bba437dd5"

          def replace_function(source: str, name: str, body: str) -> str:
              start = source.index(f"def {name}(")
              next_def = source.find("\ndef ", start + 1)
              if next_def == -1:
                  raise RuntimeError(f"cannot find end of {name}")
              return source[:start] + body.rstrip() + "\n\n" + source[next_def + 1:]

          p = Path("ai_native.py")
          text = p.read_text(encoding="utf-8").replace(old_ref, core)

          text = replace_function(text, "_workflow_events_value", '''def _workflow_events_value(workflow: Mapping[Any, Any]) -> Any:
              """Return the parsed GitHub workflow event declaration."""
              if "on" in workflow and True in workflow:
                  return None
              events = workflow.get("on")
              if events is None and True in workflow:
                  events = workflow.get(True)
              return events''')

          text = replace_function(text, "_event_runs_on_review_dismissal", '''def _event_runs_on_review_dismissal(workflow: Mapping[Any, Any]) -> bool:
              """Return whether submitted and dismissed reviews both re-run governance."""
              events = _workflow_events_value(workflow)
              if not isinstance(events, Mapping) or "pull_request_review" not in events:
                  return False
              config = events["pull_request_review"]
              if not isinstance(config, Mapping):
                  return False
              types = config.get("types")
              if not isinstance(types, Sequence) or isinstance(types, (str, bytes)):
                  return False
              return {"submitted", "dismissed"} <= {str(item) for item in types}''')

          marker = "def _job_permissions(job: Mapping[str, Any]) -> Mapping[str, Any]:\n"
          assert marker in text
          helper = '''def _event_runs_on_review_thread_changes(workflow: Mapping[Any, Any]) -> bool:
              """Return whether review-thread resolution changes re-run governance."""
              events = _workflow_events_value(workflow)
              if not isinstance(events, Mapping) or "pull_request_review_thread" not in events:
                  return False
              config = events["pull_request_review_thread"]
              if not isinstance(config, Mapping):
                  return False
              types = config.get("types")
              if not isinstance(types, Sequence) or isinstance(types, (str, bytes)):
                  return False
              return {"resolved", "unresolved"} <= {str(item) for item in types}


'''
          text = text.replace(marker, helper + marker, 1)

          text = replace_function(text, "_uses_review_wait_events", '''def _uses_review_wait_events(job: Mapping[str, Any]) -> bool:
              """Return whether the wait job runs on PR, review, and thread updates."""
              condition = _normalize_condition(job.get("if"))
              event_guard = (
                  "(github.event_name == 'pull_request' || github.event_name == 'pull_request_review' "
                  "|| github.event_name == 'pull_request_review_thread')"
              )
              draft_guard = f"{event_guard} && github.event.pull_request.draft == false"
              reverse_guard = f"github.event.pull_request.draft == false && {event_guard}"
              return condition in {event_guard, draft_guard, reverse_guard}''')

          old = '''    for raw_line in codeowners.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              parts = line.split()
              if parts and parts[0] in accepted and parts[1:]:
                  if all(_valid_codeowner(owner) for owner in parts[1:]):
                      return True
              return False
          '''
          new = '''    namespace_rule = False
              for raw_line in codeowners.read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  if parts and parts[0] in accepted and parts[1:]:
                      if all(_valid_codeowner(owner) for owner in parts[1:]):
                          namespace_rule = True
              if not namespace_rule:
                  return False
              return _codeowners_covers_path(
                  root, Path(".github/workflows/__ai_native_unmatched_probe__.yml")
              )
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    failures: list[str] = []
              if _has_forbidden_github_cli_env(workflow.get("env")):
          '''
          new = '''    failures: list[str] = []
              if "on" in workflow and True in workflow:
                  failures.append("workflow must not contain both YAML representations of the on event key")
              if _has_forbidden_github_cli_env(workflow.get("env")):
          '''
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace(
              'failures.append("pull_request_review must run on dismissed review events")',
              'failures.append("pull_request_review must explicitly run on submitted and dismissed review events")',
              1,
          )
          needle = '''    if "pull_request_review" not in events or not _event_runs_on_review_dismissal(workflow):
              failures.append("pull_request_review must explicitly run on submitted and dismissed review events")
          '''
          assert needle in text
          text = text.replace(
              needle,
              needle + '''    if "pull_request_review_thread" not in events or not _event_runs_on_review_thread_changes(workflow):
              failures.append("pull_request_review_thread must explicitly run on resolved and unresolved events")
          ''',
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path(".github/workflows/codex-review.yml")
          text = p.read_text(encoding="utf-8").replace(old_ref, core)
          text = text.replace(
              "  pull_request_review:\n    types: [submitted, dismissed]\n",
              "  pull_request_review:\n    types: [submitted, dismissed]\n  pull_request_review_thread:\n    types: [resolved, unresolved]\n",
              1,
          )
          text = text.replace(
              "if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.draft == false",
              "if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_thread') && github.event.pull_request.draft == false",
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path(".github/CODEOWNERS")
          text = p.read_text(encoding="utf-8")
          for line in ("/CHANGELOG.md @fatmambot33\n", "/RELEASE_NOTES.md @fatmambot33\n"):
              if line not in text:
                  text += line
          p.write_text(text, encoding="utf-8")

          p = Path("validator/validate_standard.py")
          text = p.read_text(encoding="utf-8")
          needle = '        "AGENTS.md",\n        "pyproject.toml",\n'
          assert needle in text
          text = text.replace(
              needle,
              '        "AGENTS.md",\n        "CHANGELOG.md",\n        "RELEASE_NOTES.md",\n        "pyproject.toml",\n',
              1,
          )
          p.write_text(text, encoding="utf-8")

          fixture_files = [
              Path("tests/test_ai_review_governance_hardening.py"),
              Path("tests/test_ai_review_governance_remaining.py"),
              Path("tests/test_validation.py"),
          ]
          old_condition = "(github.event_name == 'pull_request' || github.event_name == 'pull_request_review')"
          new_condition = "(github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_thread')"
          for fp in fixture_files:
              value = fp.read_text(encoding="utf-8").replace(old_ref, core)
              value = value.replace("    types: [dismissed]\n", "    types: [submitted, dismissed]\n")
              first = "  pull_request_review:\n    types: [submitted, dismissed]\n"
              if "pull_request_review_thread:" not in value:
                  value = value.replace(
                      first,
                      first + "  pull_request_review_thread:\n    types: [resolved, unresolved]\n",
                      1,
                  )
              value = value.replace(old_condition, new_condition)
              fp.write_text(value, encoding="utf-8")

          p = Path("tests/test_ai_review_governance_hardening.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'assert any("pull_request_review must run on dismissed" in item.message for item in findings)',
              'assert any("submitted and dismissed" in item.message for item in findings)',
          )
          text += '''\n\ndef test_review_gate_requires_submitted_review_activity(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace("types: [submitted, dismissed]", "types: [dismissed]", 1)
              _write_repository(tmp_path, workflow)
              assert any("submitted and dismissed" in item.message for item in _findings(tmp_path))


def test_review_gate_requires_review_thread_revalidation(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace(
                  "  pull_request_review_thread:\\n    types: [resolved, unresolved]\\n", "", 1
              )
              _write_repository(tmp_path, workflow)
              assert any("resolved and unresolved" in item.message for item in _findings(tmp_path))


def test_review_gate_rejects_ambiguous_on_keys(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace("on:\\n", '"on":\\n', 1) + "\\non:\\n  push:\\n"
              _write_repository(tmp_path, workflow)
              assert any("both YAML representations" in item.message for item in _findings(tmp_path))


def test_review_gate_namespace_rule_must_remain_effective(tmp_path: Path) -> None:
              _write_repository(tmp_path)
              codeowners = tmp_path / ".github" / "CODEOWNERS"
              codeowners.write_text(
                  "/.github/workflows/** @repository-owner\\n"
                  "/.github/**\\n"
                  "/.github/workflows/codex-review.yml @repository-owner\\n"
                  "/.github/CODEOWNERS @repository-owner\\n",
                  encoding="utf-8",
              )
              assert any("namespace rule" in item.message for item in _findings(tmp_path))
          '''
          p.write_text(text, encoding="utf-8")

          p = Path("tests/test_codex_review_gate.py")
          text = p.read_text(encoding="utf-8")
          text += '''\n\ndef test_native_evidence_is_reusable_for_exact_revision() -> None:
              script = GATE.read_text(encoding="utf-8")
              reusable = _function_body(script, "has_any_native_clear_codex_evidence")
              assert "revision_activation_created_at" in reusable
              assert "has_trusted_native_review_run" in reusable
              assert "has_native_matching_review" in reusable


def test_native_clean_reaction_remains_revision_bound_evidence() -> None:
              script = GATE.read_text(encoding="utf-8")
              reusable = _function_body(script, "has_any_native_clear_codex_evidence")
              assert "has_native_clean_reaction" in reusable
              assert "revision_activation_created_at" in reusable


def test_dismissal_query_errors_fail_closed() -> None:
              script = GATE.read_text(encoding="utf-8")
              reaction = _function_body(script, "has_trigger_clean_reaction")
              assert "dismissal_status" in reaction
              assert "Unable to prove marker-backed review evidence is not dismissed" in reaction
          '''
          p.write_text(text, encoding="utf-8")

          p = Path("tests/test_pr35_final_governance.py")
          text = p.read_text(encoding="utf-8").replace(old_ref, core)
          start = text.index("def test_native_review_reuse_is_bound_to_current_base_event()")
          end = text.find("\ndef ", start + 1)
          if end == -1:
              end = len(text)
          replacement = '''def test_native_review_reuse_is_bound_to_server_revision_runs() -> None:
              gate = Path("actions/codex-review-gate/codex-review-gate.sh").read_text(encoding="utf-8")
              workflow = Path(".github/workflows/codex-review.yml").read_text(encoding="utf-8")
              assert "types: [submitted, dismissed]" in workflow
              assert "pull_request_review_thread:" in workflow
              assert "revision_runs()" in gate
              assert ".head.sha" in gate
              assert ".base.sha" in gate
              assert "has_trusted_native_review_run" in gate
              assert "revision_activation_created_at" in gate
              assert "has_native_clean_reaction" in gate


def test_release_records_are_codeowner_governed() -> None:
              codeowners = Path(".github/CODEOWNERS").read_text(encoding="utf-8")
              validator = Path("validator/validate_standard.py").read_text(encoding="utf-8")
              assert "/CHANGELOG.md @fatmambot33" in codeowners
              assert "/RELEASE_NOTES.md @fatmambot33" in codeowners
              assert '"CHANGELOG.md",' in validator
              assert '"RELEASE_NOTES.md",' in validator
          '''
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding="utf-8")

          for fp in (Path("tests/test_ai_review_governance_remaining.py"), Path("tests/test_validation.py")):
              value = fp.read_text(encoding="utf-8").replace(old_ref, core)
              fp.write_text(value, encoding="utf-8")
          PY
          git rm .github/workflows/recover-pr35.yml
          git add .
          git commit -m "fix: close current Codex governance findings"
      - name: Deterministic validation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q
          python validator/validate_standard.py
          bash -n actions/codex-review-gate/codex-review-gate.sh
          git diff --check HEAD~2..HEAD
      - name: Push recovered commits
        run: git push origin HEAD:align/codex-governance
