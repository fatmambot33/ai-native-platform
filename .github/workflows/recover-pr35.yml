name: Recover PR35 governance fixes

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/recover-pr35.yml
      - .github/scripts/recover_pr35.py

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply recovered governance fixes
        run: python .github/scripts/recover_pr35.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Normalize recovered wait condition
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "(github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_thread')"
          short = "github.event.pull_request.draft == false"
          for name in (
              ".github/workflows/codex-review.yml",
              "tests/test_ai_review_governance_hardening.py",
              "tests/test_ai_review_governance_remaining.py",
              "tests/test_validation.py",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8").replace(old, short)
              path.write_text(text, encoding="utf-8")

          path = Path("ai_native.py")
          text = path.read_text(encoding="utf-8")
          needle = "return condition in {event_guard, draft_guard, reverse_guard}"
          replacement = (
              "return condition in {event_guard, draft_guard, reverse_guard, "
              "\"github.event.pull_request.draft == false\"}"
          )
          if needle not in text:
              raise RuntimeError("wait-event validator return expression not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
          ruff format ai_native.py tests/test_ai_review_governance_hardening.py tests/test_ai_review_governance_remaining.py tests/test_validation.py
          git add -A
          git commit --amend --no-edit
      - name: Run deterministic validation
        run: |
          ruff check .
          pytest -q
          python validator/validate_standard.py
          bash -n actions/codex-review-gate/codex-review-gate.sh
          git diff --check HEAD~2..HEAD
      - name: Push recovered commits
        run: git push origin HEAD:align/codex-governance
