name: Recover PR35 governance fixes

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/recover-pr35.yml
      - .github/scripts/recover_pr35.py

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply recovered governance fixes
        run: python .github/scripts/recover_pr35.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic validation
        run: |
          ruff check .
          pytest -q
          python validator/validate_standard.py
          bash -n actions/codex-review-gate/codex-review-gate.sh
          git diff --check HEAD~2..HEAD
      - name: Push recovered commits
        run: git push origin HEAD:align/codex-governance
