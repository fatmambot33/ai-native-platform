name: Apply governance hardening

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/apply-governance-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - name: Apply reviewed fixes
        run: |
          sed -i 's/re.subn(pattern, replacement, text, count=1, flags=re.S)/re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)/' .github/scripts/apply_governance_hardening.py
          python .github/scripts/apply_governance_hardening.py
      - name: Validate
        run: |
          python -m pytest -q
          python validator/validate_standard.py
      - name: Commit hardened governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-governance-hardening.yml
          rm .github/scripts/apply_governance_hardening.py
          git add -A
          git commit -m "fix: harden current-HEAD review governance"
          git push origin HEAD:align/codex-governance
