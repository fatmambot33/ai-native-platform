name: PR35 Bash function remediation

on:
  push:
    branches: [align/codex-governance]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Apply focused remediation
        shell: python
        run: |
          from pathlib import Path

          source = Path('ai_native.py')
          text = source.read_text(encoding='utf-8')
          old = '''        if normalized.startswith("GH_") or normalized in FORBIDDEN_GITHUB_CLI_ENV_KEYS:\n            return True\n'''
          new = '''        if (\n            normalized.startswith("GH_")\n            or normalized in FORBIDDEN_GITHUB_CLI_ENV_KEYS\n            or (normalized.startswith("BASH_FUNC_") and normalized.endswith("%%"))\n        ):\n            return True\n'''
          if old not in text:
              raise SystemExit('expected env validation block not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_ai_review_governance_remaining.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '''def test_review_gate_rejects_step_cli_env(tmp_path: Path) -> None:\n    workflow = WORKFLOW.replace(\n        f"      - uses: {ACTION}\\n        with:\\n",\n        f"      - uses: {ACTION}\\n        env:\\n          GH_HOST: attacker.example\\n"\n        "        with:\\n",\n        1,\n    )\n    _write_repository(tmp_path, workflow)\n\n    assert any("canonical gate step" in item.message for item in _findings(tmp_path))\n\n\n'''
          addition = anchor + '''@pytest.mark.parametrize("scope", ["workflow", "job", "step"])\ndef test_review_gate_rejects_imported_bash_functions(tmp_path: Path, scope: str) -> None:\n    env_line = '"BASH_FUNC_gh%%": "() { :; }"'\n    if scope == "workflow":\n        workflow = WORKFLOW.replace("on:\\n", f"env:\\n  {env_line}\\non:\\n", 1)\n    elif scope == "job":\n        workflow = WORKFLOW.replace(\n            "    runs-on: ubuntu-latest\\n    permissions:\\n",\n            f"    runs-on: ubuntu-latest\\n    env:\\n      {env_line}\\n    permissions:\\n",\n            1,\n        )\n    else:\n        workflow = WORKFLOW.replace(\n            f"      - uses: {ACTION}\\n        with:\\n",\n            f"      - uses: {ACTION}\\n        env:\\n          {env_line}\\n        with:\\n",\n            1,\n        )\n    _write_repository(tmp_path, workflow)\n\n    assert _findings(tmp_path)\n\n\n'''
          if anchor not in text:
              raise SystemExit('expected step env test anchor not found')
          tests.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
      - name: Deterministic validation
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
          python -m ai_native validate fixtures/passing/library.yaml --root fixtures --format json
          bash -n actions/codex-review-gate/preflight.sh actions/codex-review-gate/codex-review-gate.sh
          python -m build
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_native.py tests/test_ai_review_governance_remaining.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reject imported Bash function overrides'
          git push origin HEAD:align/codex-governance
