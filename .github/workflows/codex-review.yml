name: Codex review governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Mark current HEAD review pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context=codex-review \
            -f description='Waiting for Codex review of current HEAD' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
      - name: Checkout trusted governance code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Require Codex review of current HEAD
        id: gate
        continue-on-error: true
        uses: ./actions/codex-review-gate
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
      - name: Publish current HEAD review result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [[ "$GATE_OUTCOME" == "success" ]]; then
            state=success
            description='Codex reviewed current HEAD'
          else
            state=failure
            description='Codex review of current HEAD did not pass'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=codex-review \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
      - name: Require successful Codex gate
        if: steps.gate.outcome != 'success'
        run: exit 1
