name: Codex review governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]
  pull_request_target:
    types: [labeled]
  pull_request_review:
    types: [dismissed]

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request:
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'codex:review' && github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Request one merge-ready Codex review
        uses: fatmambot33/ai-native-platform/actions/codex-review-gate@48f0c6c4351a040f3214ef01e036b5f00032b2cd
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          mode: request
          request-label: codex:review

  codex-review:
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && github.event.pull_request.draft == false
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Require Codex review of current HEAD and resolved threads
        uses: fatmambot33/ai-native-platform/actions/codex-review-gate@48f0c6c4351a040f3214ef01e036b5f00032b2cd
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          mode: wait
          request-label: codex:review
