name: Final Codex governance fixes

on:
  push:
    branches: [align/codex-governance]

permissions:
  contents: write

concurrency:
  group: final-codex-governance-fixes
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and validate final Codex fixes
        run: python .github/scripts/tmp_final_codex_fixes.py
