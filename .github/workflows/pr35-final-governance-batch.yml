name: PR35 final governance batch

on:
  push:
    branches: [align/codex-governance]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Apply focused remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new, 1)
                  p.write_text(text, encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'missing expected replacement in {path}: {old[:80]!r}')

          # 1. Revalidate the exact review object carried by submitted events.
          preflight = Path('actions/codex-review-gate/preflight.sh')
          text = preflight.read_text(encoding='utf-8')
          helper = '''\nevent_review_is_live() {\n  local review_id review status\n  review_id="$(jq -r '.review.id // empty' "$GITHUB_EVENT_PATH")"\n  [[ -n "$review_id" ]] || return 1\n  if ! review="$(gh api -H "Accept: application/vnd.github+json" "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${review_id}")"; then\n    echo "::error::Unable to revalidate the submitted Codex review object."\n    return 2\n  fi\n  if jq -e \\\n    --arg head "$HEAD_SHA" \\\n    '(((.user.login // "") == "chatgpt-codex-connector") or ((.user.login // "") == "chatgpt-codex-connector[bot]")) and ((.state // "") != "DISMISSED") and ((.commit_id // "") == $head)' \\\n    <<<"$review" >/dev/null; then\n    return 0\n  else\n    status=$?\n  fi\n  [[ "$status" -eq 1 ]] && return 1\n  return 2\n}\n'''
          anchor = '\n# Reusable native evidence must come from a live, non-dismissed exact-HEAD review\n'
          if 'event_review_is_live() {' not in text:
              if anchor not in text:
                  raise SystemExit('preflight helper anchor missing')
              text = text.replace(anchor, helper + anchor, 1)
          old = '''  if is_current_base_native_review_submission; then\n    if has_native_matching_review ""; then\n      :\n    else\n      review_status=$?\n      [[ "$review_status" -eq 1 ]] && return 1\n      echo "::error::Unable to prove the submitted Codex review remains live and non-dismissed."\n      return 2\n    fi\n'''
          new = '''  if is_current_base_native_review_submission; then\n    if event_review_is_live; then\n      :\n    else\n      review_status=$?\n      [[ "$review_status" -eq 1 ]] && return 1\n      echo "::error::Unable to prove the submitted Codex review remains live and non-dismissed."\n      return 2\n    fi\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('submitted-review live-state block missing')
          preflight.write_text(text, encoding='utf-8')

          # 2. Scope concurrency to exact PR HEAD.
          new_group = 'codex-review-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}'
          replace_once(
              'ai_native.py',
              'expected_group = "codex-review-${{ github.event_name }}-${{ github.event.pull_request.number }}"',
              f'expected_group = "{new_group}"',
          )
          # Patch workflow in the checkout for deterministic validation only; it is not staged by this job.
          workflow = Path('.github/workflows/codex-review.yml')
          wf_text = workflow.read_text(encoding='utf-8')
          wf_text = wf_text.replace(
              'group: codex-review-${{ github.event_name }}-${{ github.event.pull_request.number }}',
              f'group: {new_group}',
          )
          workflow.write_text(wf_text, encoding='utf-8')

          # 3. Constrain review-context to a non-expression literal safe for publication.
          ai = Path('ai_native.py')
          text = ai.read_text(encoding='utf-8')
          helper = '''\n\ndef _safe_review_context(value: Any) -> bool:\n    """Return whether review context is absent or a safe non-expression literal."""\n    if value in (None, ""):\n        return True\n    if not isinstance(value, str) or len(value) > 128:\n        return False\n    return re.fullmatch(r"[A-Za-z0-9._:/-]+", value) is not None\n'''
          anchor = '\n\ndef _permission_declaration_is_forbidden(value: Any) -> bool:\n'
          if 'def _safe_review_context(' not in text:
              if anchor not in text:
                  raise SystemExit('review-context helper anchor missing')
              text = text.replace(anchor, helper + anchor, 1)
          old = '''    if _gate_optional_input(request, "review-context") != _gate_optional_input(\n        wait, "review-context"\n    ):\n        failures.append("request and wait jobs must use the same review-context")\n'''
          new = '''    request_context = _gate_optional_input(request, "review-context")\n    wait_context = _gate_optional_input(wait, "review-context")\n    if request_context != wait_context:\n        failures.append("request and wait jobs must use the same review-context")\n    elif not _safe_review_context(request_context):\n        failures.append(\n            "review-context must be absent or a safe non-expression literal "\n            "containing only letters, digits, dot, underscore, colon, slash, or hyphen"\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('review-context validation block missing')
          ai.write_text(text, encoding='utf-8')

          # 4. Protect remaining security/distribution policies.
          codeowners = Path('.github/CODEOWNERS')
          text = codeowners.read_text(encoding='utf-8')
          for line in ('/docs/SECURITY_EVIDENCE.md @fatmambot33\n', '/docs/DISTRIBUTION.md @fatmambot33\n'):
              if line not in text:
                  marker = '/docs/AI_REVIEW_GOVERNANCE.md @fatmambot33\n'
                  text = text.replace(marker, marker + line, 1)
          codeowners.write_text(text, encoding='utf-8')

          validator = Path('validator/validate_standard.py')
          text = validator.read_text(encoding='utf-8')
          marker = '        "docs/AI_REVIEW_GOVERNANCE.md",\n'
          additions = '        "docs/SECURITY_EVIDENCE.md",\n        "docs/DISTRIBUTION.md",\n'
          if '"docs/SECURITY_EVIDENCE.md",' not in text:
              text = text.replace(marker, marker + additions, 1)
          validator.write_text(text, encoding='utf-8')

          # 5. Synchronize adoption guidance with reaction exclusion.
          docs = Path('docs/AI_REVIEW_GOVERNANCE.md')
          text = docs.read_text(encoding='utf-8')
          old = '''job reuses that native review and treats the current GitHub workflow run's\nserver timestamp as the activation boundary. It accepts only exact-current-HEAD\nCodex review evidence created after that boundary (or a clean Codex PR reaction\ncreated after it), and it never emits a second `@codex review` request for the\nsame checkpoint.\n'''
          new = '''job reuses native evidence only when GitHub exposes a live, non-dismissed\nexact-current-HEAD Codex review object with server-verifiable workflow-run\nprovenance and no unresolved Codex threads. PR-level reactions are not\nrevision-addressed and therefore are not reusable native success evidence. A\nreaction-only result must complete through the marker-backed fallback request\npath instead.\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('governance reaction guidance block missing')
          docs.write_text(text, encoding='utf-8')

          # Focused regression coverage.
          tests = Path('tests/test_pr35_final_governance.py')
          text = tests.read_text(encoding='utf-8')
          addition = '''\n\ndef test_submitted_review_rechecks_event_review_id_live_state() -> None:\n    preflight = Path("actions/codex-review-gate/preflight.sh").read_text(encoding="utf-8")\n    assert "event_review_is_live()" in preflight\n    assert "pulls/${PR_NUMBER}/reviews/${review_id}" in preflight\n    body = preflight.split("has_any_native_clear_codex_evidence() {", 1)[1].split("\\n}\\n", 1)[0]\n    assert "if event_review_is_live; then" in body\n\n\ndef test_review_wait_concurrency_is_scoped_to_head() -> None:\n    import ai_native\n\n    source = inspect.getsource(ai_native._single_ai_review_workflow_findings)\n    workflow = Path(".github/workflows/codex-review.yml").read_text(encoding="utf-8")\n    expected = "codex-review-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}"\n    assert expected in source\n    assert f"group: {expected}" in workflow\n\n\ndef test_review_context_rejects_expressions_and_accepts_safe_literals() -> None:\n    import ai_native\n\n    assert ai_native._safe_review_context("")\n    assert ai_native._safe_review_context("release/v0.4:checkpoint-1")\n    assert not ai_native._safe_review_context("${{ github.token }}")\n    assert not ai_native._safe_review_context("${{ secrets.PRODUCTION_TOKEN }}")\n\n\ndef test_security_evidence_and_distribution_docs_are_codeowner_governed() -> None:\n    codeowners = Path(".github/CODEOWNERS").read_text(encoding="utf-8")\n    validator = Path("validator/validate_standard.py").read_text(encoding="utf-8")\n    for relative in ("docs/SECURITY_EVIDENCE.md", "docs/DISTRIBUTION.md"):\n        assert f"/{relative} @fatmambot33" in codeowners\n        assert f'"{relative}",' in validator\n\n\ndef test_governance_docs_exclude_pr_reactions_as_native_success() -> None:\n    docs = Path("docs/AI_REVIEW_GOVERNANCE.md").read_text(encoding="utf-8")\n    assert "PR-level reactions are not" in docs\n    assert "reaction-only result must complete through the marker-backed fallback" in docs\n'''
          if 'test_submitted_review_rechecks_event_review_id_live_state' not in text:
              text += addition
          tests.write_text(text, encoding='utf-8')

          # Once the canonical workflow is separately pinned to the newly published
          # action-source commit, synchronize trusted refs and focused test constants.
          wf_text = workflow.read_text(encoding='utf-8')
          refs = re.findall(r'ai-native-platform/actions/codex-review-gate@([0-9a-f]{40})', wf_text)
          if refs and len(set(refs)) == 1:
              ref = refs[0]
              ai = Path('ai_native.py')
              ai_text = ai.read_text(encoding='utf-8')
              ai_text = re.sub(
                  r'TRUSTED_AI_REVIEW_GATE_REFS = frozenset\(\n    \{\n        "[0-9a-f]{40}",\n    \}\n\)',
                  'TRUSTED_AI_REVIEW_GATE_REFS = frozenset(\n    {\n        "' + ref + '",\n    }\n)',
                  ai_text,
                  count=1,
              )
              ai.write_text(ai_text, encoding='utf-8')
              tests = Path('tests/test_pr35_final_governance.py')
              test_text = tests.read_text(encoding='utf-8')
              test_text = re.sub(r'REMEDIATED_GATE_REF = "[0-9a-f]{40}"', f'REMEDIATED_GATE_REF = "{ref}"', test_text, count=1)
              tests.write_text(test_text, encoding='utf-8')
          PY
      - name: Deterministic validation
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
          python -m ai_native validate fixtures/passing/library.yaml --root fixtures --format json
          bash -n actions/codex-review-gate/preflight.sh actions/codex-review-gate/codex-review-gate.sh
          python tools/discover_improvements.py --budget 20
          python -m build
          git diff --check
      - name: Commit ordinary repository changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add actions/codex-review-gate/preflight.sh ai_native.py .github/CODEOWNERS validator/validate_standard.py docs/AI_REVIEW_GOVERNANCE.md tests/test_pr35_final_governance.py
          if git diff --cached --quiet; then
            echo "No ordinary changes to publish."
            exit 0
          fi
          git commit -m "fix: close final Codex governance findings"
          git push origin HEAD:align/codex-governance
