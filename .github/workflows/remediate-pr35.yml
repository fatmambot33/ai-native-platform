name: Remediate PR35 governance findings

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/remediate-pr35.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply gate hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          gate = Path('actions/codex-review-gate/codex-review-gate.sh')
          replace_once(
              gate,
              'BASE_SHA="${BASE_SHA:-}"\nREVIEW_CONTEXT="${CODEX_REVIEW_CONTEXT:-${BASE_SHA}}"\n: "${REVIEW_CONTEXT:?BASE_SHA or CODEX_REVIEW_CONTEXT is required}"\n',
              ': "${BASE_SHA:?BASE_SHA is required}"\nREVIEW_CONTEXT="${CODEX_REVIEW_CONTEXT:-}"\n',
          )
          replace_once(
              gate,
              'MARKER="<!-- ai-native-codex-review-gate:${HEAD_SHA}:${REVIEW_CONTEXT} -->"\n',
              'MARKER="<!-- ai-native-codex-review-gate:${HEAD_SHA}:${BASE_SHA}:${REVIEW_CONTEXT} -->"\n',
          )
          api_block = '''api_list() {
            local endpoint="$1"
            gh api --paginate \\
              -H "Accept: application/vnd.github+json" \\
              "$endpoint" \\
              --jq '.[]' | jq -s '.'
          }

          '''
          helpers = '''verify_codeowners() {
            local response
            if ! response="$(gh api -H "Accept: application/vnd.github+json" "repos/${REPO}/codeowners/errors?ref=${HEAD_SHA}")"; then
              echo "::error::Unable to verify CODEOWNERS with GitHub for current HEAD ${SHORT_SHA}."
              return 2
            fi
            if ! jq -e '(.errors | type == "array") and ((.errors | length) == 0)' <<<"$response" >/dev/null; then
              echo "::error::GitHub reports invalid or ineffective CODEOWNERS entries for current HEAD ${SHORT_SHA}."
              jq -r '.errors[]? | "::error::CODEOWNERS line \(.line // "?"): \(.message // .kind // "invalid owner")"' <<<"$response"
              return 1
            fi
          }

          sleep_until_deadline() {
            local deadline="$1"
            local remaining=$((deadline - SECONDS))
            (( remaining > 0 )) || return 0
            local delay="$POLL_SECONDS"
            if (( delay > remaining )); then
              delay="$remaining"
            fi
            sleep "$delay"
          }

          '''
          replace_once(gate, api_block, api_block + helpers)
          replace_once(
              gate,
              'case "$MODE" in\n',
              'if ! verify_codeowners; then\n  exit $?\nfi\n\ncase "$MODE" in\n',
          )
          replace_once(
              gate,
              '''  request-and-wait)
            start_status
            if has_clear_codex_evidence; then
              echo "Codex already reviewed current HEAD ${SHORT_SHA} for this review context."
              complete_status success
              exit 0
            fi
            request_review
          ''',
              '''  request-and-wait)
            start_status
            if has_clear_codex_evidence; then
              echo "Codex already reviewed current HEAD ${SHORT_SHA} for this review context."
              complete_status success
              exit 0
            fi
            if ! is_request_label_event; then
              echo "::error::request-and-wait may consume review quota only on an explicit ${REQUEST_LABEL} label event."
              exit 1
            fi
            trap clear_request_label EXIT
            request_review
          ''',
          )
          text = gate.read_text(encoding='utf-8')
          replaced = text.replace('      sleep "$POLL_SECONDS"\n', '      sleep_until_deadline "$deadline"\n')
          replaced = replaced.replace('    sleep "$POLL_SECONDS"\n', '    sleep_until_deadline "$deadline"\n')
          replaced = replaced.replace('  sleep "$POLL_SECONDS"\n', '  sleep_until_deadline "$deadline"\n')
          if replaced == text or 'sleep "$POLL_SECONDS"' in replaced:
              raise SystemExit('failed to replace all polling sleeps')
          gate.write_text(replaced, encoding='utf-8')

          tests = Path('tests/test_ai_review_governance_remaining.py')
          addition = r'''

          def test_gate_binds_marker_to_head_base_and_context() -> None:
              source = Path("actions/codex-review-gate/codex-review-gate.sh").read_text(encoding="utf-8")
              assert 'MARKER="<!-- ai-native-codex-review-gate:${HEAD_SHA}:${BASE_SHA}:${REVIEW_CONTEXT} -->"' in source


          def test_gate_verifies_codeowners_with_github() -> None:
              source = Path("actions/codex-review-gate/codex-review-gate.sh").read_text(encoding="utf-8")
              assert 'repos/${REPO}/codeowners/errors?ref=${HEAD_SHA}' in source
              assert 'if ! verify_codeowners; then' in source


          def test_request_and_wait_requires_explicit_review_label() -> None:
              source = Path("actions/codex-review-gate/codex-review-gate.sh").read_text(encoding="utf-8")
              block = source.split('  request-and-wait)', 1)[1].split('    ;;', 1)[0]
              assert 'if ! is_request_label_event; then' in block
              assert 'trap clear_request_label EXIT' in block


          def test_gate_clamps_polling_to_deadline() -> None:
              source = Path("actions/codex-review-gate/codex-review-gate.sh").read_text(encoding="utf-8")
              assert 'sleep_until_deadline()' in source
              assert 'if (( delay > remaining )); then' in source
              assert 'sleep "$POLL_SECONDS"' not in source
          '''
          text = tests.read_text(encoding='utf-8')
          if 'test_gate_binds_marker_to_head_base_and_context' not in text:
              tests.write_text(text + addition, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions/codex-review-gate/codex-review-gate.sh tests/test_ai_review_governance_remaining.py
          git commit -m "fix: harden Codex gate evidence and retries"
          echo "GATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Apply conformance hardening and pin gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          gate_sha = os.environ['GATE_SHA']
          old_ref = '96f34eeb234cb9c4cebf68749a8fcbca969f5865'

          ai = Path('ai_native.py')
          text = ai.read_text(encoding='utf-8')
          old = '''    for key in ("timeout-seconds", "poll-seconds"):
              if key in inputs and not _positive_integer_input(inputs[key]):
                  return None
              return uses[len(prefix) :]
          '''
          new = '''    for key in ("timeout-seconds", "poll-seconds"):
              if key in inputs and not _positive_integer_input(inputs[key]):
                  return None
              timeout = int(inputs.get("timeout-seconds", 1800))
              poll = int(inputs.get("poll-seconds", 60))
              if poll > timeout:
                  return None
              return uses[len(prefix) :]
          '''
          if old not in text:
              raise SystemExit('timing validation anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''def _single_ai_review_workflow_findings(value: str, root: Path) -> list[Finding]:
          '''
          helper = '''def _codeowners_has_workflow_namespace_rule(root: Path) -> bool:
              """Return whether CODEOWNERS explicitly protects the workflow namespace."""
              codeowners = root / ".github" / "CODEOWNERS"
              if _path_has_symlink_component(root, Path(".github/CODEOWNERS")) or not codeowners.is_file():
                  return False
              accepted = {
                  "/.github/workflows/**",
                  ".github/workflows/**",
                  "/.github/workflows/",
                  ".github/workflows/",
              }
              for raw_line in codeowners.read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  if parts and parts[0] in accepted and parts[1:]:
                      if all(_valid_codeowner(owner) for owner in parts[1:]):
                          return True
              return False


def _unowned_workflows(root: Path) -> list[str]:
              """Return current workflow files lacking effective CODEOWNERS coverage."""
              directory = root / ".github" / "workflows"
              if not directory.is_dir() or directory.is_symlink():
                  return [".github/workflows"]
              missing: list[str] = []
              for path in sorted(directory.iterdir()):
                  if path.suffix not in {".yml", ".yaml"}:
                      continue
                  relative = path.relative_to(root)
                  if _path_has_symlink_component(root, relative) or not _codeowners_covers_path(root, relative):
                      missing.append(relative.as_posix())
              return missing


'''
          if anchor not in text:
              raise SystemExit('workflow findings anchor not found')
          text = text.replace(anchor, helper + anchor, 1)

          old = '''    if not _codeowners_covers_path(
                  root, Path(".github/workflows/__ai_native_required_check_probe__.yml")
              ):
                  failures.append("the entire .github/workflows namespace must be CODEOWNERS-protected")
          '''
          new = '''    if not _codeowners_has_workflow_namespace_rule(root):
                  failures.append("CODEOWNERS must contain an explicit .github/workflows namespace rule")
              unowned_workflows = _unowned_workflows(root)
              if unowned_workflows:
                  failures.append(
                      "every workflow must have effective CODEOWNERS coverage; missing: "
                      + ", ".join(unowned_workflows)
                  )
          '''
          if old not in text:
              raise SystemExit('namespace validation anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(old_ref, gate_sha)
          ai.write_text(text, encoding='utf-8')

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == ai:
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old_ref in data:
                  path.write_text(data.replace(old_ref, gate_sha), encoding='utf-8')

          tests = Path('tests/test_ai_review_governance_remaining.py')
          addition = r'''

          def test_review_gate_rejects_poll_interval_longer_than_timeout(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace(
                  "          request-label: codex:review\n",
                  "          request-label: codex:review\n          timeout-seconds: 30\n          poll-seconds: 3600\n",
                  2,
              )
              _write_repository(tmp_path, workflow)
              assert _findings(tmp_path)


          def test_review_gate_requires_namespace_wide_codeowners_rule(tmp_path: Path) -> None:
              _write_repository(tmp_path)
              codeowners = tmp_path / ".github" / "CODEOWNERS"
              codeowners.write_text(
                  "/.github/workflows/codex-review.yml @repository-owner\n"
                  "/.github/CODEOWNERS @repository-owner\n",
                  encoding="utf-8",
              )
              assert any("namespace rule" in item.message for item in _findings(tmp_path))


          def test_review_gate_checks_every_existing_workflow_owner(tmp_path: Path) -> None:
              _write_repository(tmp_path)
              extra = tmp_path / ".github" / "workflows" / "bypass.yml"
              extra.write_text("name: bypass\non: push\njobs: {}\n", encoding="utf-8")
              codeowners = tmp_path / ".github" / "CODEOWNERS"
              codeowners.write_text(
                  codeowners.read_text(encoding="utf-8")
                  + "/.github/workflows/bypass.yml\n",
                  encoding="utf-8",
              )
              assert any("bypass.yml" in item.message for item in _findings(tmp_path))
          '''
          data = tests.read_text(encoding='utf-8')
          if 'test_review_gate_rejects_poll_interval_longer_than_timeout' not in data:
              tests.write_text(data + addition, encoding='utf-8')
          PY
          git rm .github/workflows/remediate-pr35.yml
          git add -A
          git commit -m "fix: close latest Codex governance findings"
      - name: Validate final tree
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          ruff check .
          pytest
          python validator/validate_standard.py
      - name: Push validated remediation
        run: git push origin HEAD:align/codex-governance
