name: Publish validated PR35 code fixes

on:
  push:
    branches: [maintenance/pr35-finalize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/pr35-finalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Apply validated non-workflow fixes
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          shell = Path('actions/codex-review-gate/codex-review-gate.sh')
          text = shell.read_text(encoding='utf-8')
          new_function = '''has_any_native_clear_codex_evidence() {
            if ! has_any_native_matching_review; then
              return 1
            fi
            if has_unresolved_codex_threads; then
              echo "Native Codex review exists for current HEAD ${SHORT_SHA}, but unresolved Codex review threads remain."
              return 1
            else
              local thread_status=$?
              if [[ "$thread_status" -eq 1 ]]; then
                return 0
              fi
              echo "::error::Unable to prove that all Codex review threads are resolved for current HEAD ${SHORT_SHA}."
              return 1
            fi
          }'''
          pattern = r'has_any_native_clear_codex_evidence\(\) \{.*?\n\}\n\nhas_native_clean_reaction\(\)'
          text, count = re.subn(pattern, new_function + '\n\nhas_native_clean_reaction()', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'native-review function replacements: {count}')
          shell.write_text(text, encoding='utf-8')

          core = Path('ai_native.py')
          text = core.read_text(encoding='utf-8')
          pattern = r'(    if any\(inputs\.get\(key\) != value for key, value in required_inputs\.items\(\)\):\n        return None\n)(    for key in \("timeout-seconds", "poll-seconds"\):)'
          replacement = r'\1    if inputs.get("check-name") not in (None, ""):\n        return None\n\2'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'gate input replacements: {count}')
          core.write_text(text, encoding='utf-8')

          Path('tests/test_pr35_final_governance.py').write_text('''import inspect\nfrom pathlib import Path\n\nimport ai_native\n\n\ndef test_canonical_gate_rejects_nonempty_check_name() -> None:\n    source = inspect.getsource(ai_native._gate_ref)\n    assert 'inputs.get("check-name") not in (None, "")' in source\n\n\ndef test_native_review_thread_status_is_captured_in_else_branch() -> None:\n    text = Path("actions/codex-review-gate/codex-review-gate.sh").read_text(\n        encoding="utf-8"\n    )\n    segment = text.split("has_any_native_clear_codex_evidence()", 1)[1]\n    segment = segment.split("has_native_clean_reaction()", 1)[0]\n    assert "else\\n    local thread_status=$?" in segment\n''', encoding='utf-8')
          PY
      - run: |
          ruff check .
          pytest
          python validator/validate_standard.py
          git diff --check
      - name: Commit only non-workflow files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_native.py actions/codex-review-gate/codex-review-gate.sh tests/test_pr35_final_governance.py
          git commit -m 'fix: close final Codex gate code gaps'
          git push origin HEAD:maintenance/pr35-finalize
