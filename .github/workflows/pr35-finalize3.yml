name: Publish final PR35 governance remediation

on:
  push:
    branches: [maintenance/pr35-finalize]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Apply remaining governance fixes
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          core = Path('ai_native.py')
          text = core.read_text(encoding='utf-8')
          pattern = r'def _codeowners_has_workflow_namespace_rule\(root: Path\) -> bool:\n.*?\n\ndef _unowned_workflows\(root: Path\) -> list\[str\]:'
          replacement = '''def _codeowners_has_workflow_namespace_rule(root: Path) -> bool:
              """Return whether the final CODEOWNERS rule protects every workflow path."""
              codeowners = root / ".github" / "CODEOWNERS"
              if _path_has_symlink_component(root, Path(".github/CODEOWNERS")) or not codeowners.is_file():
                  return False
              accepted = {
                  "/.github/workflows/**",
                  ".github/workflows/**",
                  "/.github/workflows/",
                  ".github/workflows/",
              }
              active_rules: list[tuple[str, list[str]]] = []
              for raw_line in codeowners.read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  if parts:
                      active_rules.append((parts[0], parts[1:]))
              if not active_rules:
                  return False
              pattern, owners = active_rules[-1]
              return (
                  pattern in accepted
                  and bool(owners)
                  and all(_valid_codeowner(owner) for owner in owners)
              )


def _unowned_workflows(root: Path) -> list[str]:'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'workflow namespace function replacements: {count}')
          core.write_text(text, encoding='utf-8')

          validator = Path('validator/validate_standard.py')
          text = validator.read_text(encoding='utf-8')
          needle = '        ".github/CODEOWNERS",\n'
          if '        ".github/dependabot.yml",\n' not in text:
              if needle not in text:
                  raise SystemExit('governed_paths insertion point missing')
              text = text.replace(
                  needle,
                  needle + '        ".github/dependabot.yml",\n',
                  1,
              )
          validator.write_text(text, encoding='utf-8')

          codeowners = Path('.github/CODEOWNERS')
          lines = codeowners.read_text(encoding='utf-8').splitlines()
          namespace_rules = {
              '/.github/workflows/**',
              '.github/workflows/**',
              '/.github/workflows/',
              '.github/workflows/',
          }
          retained = [
              line for line in lines
              if not (line.split() and line.split()[0] in namespace_rules)
          ]
          retained.append('/.github/workflows/** @fatmambot33')
          codeowners.write_text('\n'.join(retained) + '\n', encoding='utf-8')

          test = Path('tests/test_pr35_followup_regressions.py')
          text = test.read_text(encoding='utf-8')
          if 'import ai_native\n' not in text:
              text = text.replace('from pathlib import Path\n', 'from pathlib import Path\n\nimport ai_native\n', 1)
          addition = '''\n\ndef test_workflow_namespace_ownership_cannot_be_reenabled_only_for_known_probe(tmp_path: Path) -> None:
              """Require the namespace-wide workflow owner rule to be the final effective rule."""
              github = tmp_path / ".github"
              github.mkdir()
              codeowners = github / "CODEOWNERS"
              codeowners.write_text(
                  "/.github/workflows/** @fatmambot33\\n"
                  "/.github/workflows/**\\n"
                  "/.github/workflows/__ai_native_unmatched_probe__.yml @fatmambot33\\n",
                  encoding="utf-8",
              )
              assert not ai_native._codeowners_has_workflow_namespace_rule(tmp_path)
              codeowners.write_text(
                  codeowners.read_text(encoding="utf-8")
                  + "/.github/workflows/** @fatmambot33\\n",
                  encoding="utf-8",
              )
              assert ai_native._codeowners_has_workflow_namespace_rule(tmp_path)


def test_dependabot_configuration_is_canonically_governed() -> None:
              """Keep Dependabot in the canonical governed-path self-check."""
              validator = (ROOT / "validator" / "validate_standard.py").read_text(encoding="utf-8")
              assert '".github/dependabot.yml"' in validator
'''
          if 'test_workflow_namespace_ownership_cannot_be_reenabled_only_for_known_probe' not in text:
              text += addition
          test.write_text(text, encoding='utf-8')
          PY
      - name: Validate remediation
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
          python -m ai_native validate fixtures/passing/library.yaml --root fixtures --format json
          bash -n actions/codex-review-gate/preflight.sh actions/codex-review-gate/codex-review-gate.sh
          python tools/discover_improvements.py --budget 20
          git diff --check
      - name: Commit and push PR head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_native.py validator/validate_standard.py .github/CODEOWNERS tests/test_pr35_followup_regressions.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close final PR35 governance gaps'
          git push origin HEAD:align/codex-governance
