name: Publish final PR35 governance remediation

on:
  push:
    branches:
      - maintenance/pr35-finalize

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          ref: maintenance/pr35-finalize
          path: publisher
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
          path: target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        working-directory: target
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Apply remaining governance fixes
        working-directory: target
        run: python ../publisher/.github/scripts/finalize_pr35.py
      - name: Validate remediation
        working-directory: target
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
          python -m ai_native validate fixtures/passing/library.yaml --root fixtures --format json
          bash -n actions/codex-review-gate/preflight.sh actions/codex-review-gate/codex-review-gate.sh
          python tools/discover_improvements.py --budget 20
          python -m build
          git diff --check
      - name: Commit and push PR head
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_native.py tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: close final Codex governance findings'
          git push origin HEAD:align/codex-governance
