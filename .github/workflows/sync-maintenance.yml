name: Final maintenance validation

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/sync-maintenance.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate maintenance candidate
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
          python tools/discover_improvements.py --budget 20 > improvement-findings.json
          python - <<'PY'
          import json
          from pathlib import Path
          findings = json.loads(Path('improvement-findings.json').read_text())
          if findings:
              raise SystemExit(f'Canonical discovery still reports findings: {findings}')
          PY
