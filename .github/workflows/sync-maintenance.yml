name: Sync maintenance branch

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/sync-maintenance.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Validate merged tree
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          ruff check .
          pytest
          python validator/validate_standard.py
      - name: Export validated sync
        run: git push --force origin HEAD:maintenance/pr35-synced
