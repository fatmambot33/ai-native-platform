name: AI self-improvement discovery

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check .
      - name: Produce structured findings
        run: python tools/discover_improvements.py > findings.json
      - name: Create one deduplicated issue per finding
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'enhancement',
              per_page: 100
            });
            for (const finding of findings) {
              const location = finding.path || 'canonical standard';
              const title = `[AI discovery] ${finding.code}: ${location}`.slice(0, 240);
              if (openIssues.some(issue => issue.title === title)) continue;
              const body = [
                'Automated conformance discovery found a concrete standards gap.',
                '',
                `**Code:** \`${finding.code}\``,
                `**Location:** \`${location}\``,
                '',
                finding.message,
                '',
                '## Acceptance criteria',
                '',
                '- [ ] The finding is reproduced with a failing test',
                '- [ ] The root cause is fixed without weakening validation',
                '- [ ] Tests, documentation, templates, changelog, and roadmap are updated as applicable',
                '- [ ] `python validator/validate_standard.py` passes',
                '- [ ] High-impact changes receive human approval before merge'
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['enhancement']
              });
            }
