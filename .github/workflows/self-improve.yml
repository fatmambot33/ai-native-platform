name: AI self-improvement discovery

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      issue_budget:
        description: Maximum issues created in this run
        required: false
        default: '5'

permissions:
  contents: read
  issues: write
  actions: read
  security-events: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      AI_NATIVE_ISSUE_BUDGET: ${{ inputs.issue_budget || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Produce bounded structured findings
        run: python tools/discover_improvements.py > findings.json
      - name: Create one issue per root cause
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'enhancement',
              per_page: 100
            });
            for (const finding of findings) {
              const marker = `<!-- ai-native-fingerprint:${finding.fingerprint} -->`;
              if (openIssues.some(issue => (issue.body || '').includes(marker))) continue;
              const location = finding.path || 'repository';
              const title = `[AI discovery] ${finding.title}`.slice(0, 240);
              const body = [
                marker,
                'Evidence-driven discovery found one actionable root cause.',
                '',
                `**Code:** \`${finding.code}\``,
                `**Severity:** \`${finding.severity}\``,
                `**Location:** \`${location}\``,
                `**Fingerprint:** \`${finding.fingerprint}\``,
                '',
                finding.body,
                '',
                '## Acceptance criteria',
                '',
                '- [ ] Reproduce the finding with a focused failing test',
                '- [ ] Fix the root cause without weakening validation',
                '- [ ] Keep generated output free of secrets and untrusted raw logs',
                '- [ ] Update docs, fixtures, changelog, and roadmap as applicable',
                '- [ ] Pass quality, canonical validation, and CodeQL',
                '- [ ] Obtain human approval for high-impact changes'
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['enhancement']
              });
            }
