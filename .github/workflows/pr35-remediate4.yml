name: Publish PR35 final remediation

on:
  push:
    branches: [maintenance/pr35-finalize]
    paths: [.github/workflows/pr35-remediate4.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          OLD = "0c4f68f62abb426ba80d0d1bb36356c3468f5534"
          NEW = "0b5ce84c0d6560adffce4b1c32e08ba2a57de7ea"

          path = Path("ai_native.py")
          text = path.read_text()
          assert OLD in text
          text = text.replace(OLD, NEW)
          text = text.replace(
              'FORBIDDEN_GITHUB_CLI_ENV_KEYS = frozenset({"GITHUB_TOKEN", "GITHUB_ENTERPRISE_TOKEN"})',
              'MAX_AI_REVIEW_TIMING_SECONDS = 2_147_483_647\nFORBIDDEN_GITHUB_CLI_ENV_KEYS = frozenset(\n    {"GITHUB_TOKEN", "GITHUB_ENTERPRISE_TOKEN", "BASH_ENV"}\n)',
          )
          old_helper = '''def _positive_integer_input(value: Any) -> bool:\n    """Return whether an action input is a Bash-safe positive decimal integer."""\n    if isinstance(value, bool):\n        return False\n    if isinstance(value, int):\n        return value > 0\n    if isinstance(value, str):\n        return re.fullmatch(r"[1-9][0-9]*", value) is not None\n    return False\n'''
          new_helper = '''def _positive_integer_input(value: Any) -> bool:\n    """Return whether an action input is a bounded Bash-safe positive integer."""\n    if isinstance(value, bool):\n        return False\n    if isinstance(value, int):\n        return 0 < value <= MAX_AI_REVIEW_TIMING_SECONDS\n    if isinstance(value, str):\n        if re.fullmatch(r"[1-9][0-9]*", value) is None:\n            return False\n        limit = str(MAX_AI_REVIEW_TIMING_SECONDS)\n        if len(value) > len(limit):\n            return False\n        if len(value) == len(limit) and value > limit:\n            return False\n        return True\n    return False\n'''
          assert old_helper in text
          text = text.replace(old_helper, new_helper)
          text = text.replace(
              '"""Return whether declared env can redirect or re-authenticate GitHub CLI."""',
              '"""Return whether declared env can alter trusted gate execution or GitHub CLI."""',
          )
          old_targets = '''        targets_workflows = (\n            normalized == ".github/workflows"\n            or normalized.startswith(".github/workflows/")\n            or "/" not in normalized\n            or (\n                matcher is not None\n                and any(matcher.fullmatch(probe) for probe in probes)\n            )\n        )\n'''
          new_targets = '''        generated_probe = None\n        if matcher is not None and any(char in normalized for char in "*?["):\n            basename = normalized.rsplit("/", 1)[-1]\n            basename = re.sub(r"\\[[^]]+\\]", "x", basename)\n            basename = basename.replace("*", "x").replace("?", "x")\n            if basename and "/" not in basename:\n                generated_probe = f".github/workflows/{basename}"\n        targets_workflows = (\n            normalized == ".github/workflows"\n            or normalized.startswith(".github/workflows/")\n            or "/" not in normalized\n            or (\n                matcher is not None\n                and any(matcher.fullmatch(probe) for probe in probes)\n            )\n            or (\n                matcher is not None\n                and generated_probe is not None\n                and matcher.fullmatch(generated_probe) is not None\n            )\n        )\n'''
          assert old_targets in text
          text = text.replace(old_targets, new_targets)
          path.write_text(text)

          workflow = Path(".github/workflows/codex-review.yml")
          workflow_text = workflow.read_text()
          assert OLD in workflow_text
          workflow.write_text(workflow_text.replace(OLD, NEW))

          for test_path in Path("tests").glob("test_*.py"):
              test_text = test_path.read_text()
              if OLD in test_text:
                  test_path.write_text(test_text.replace(OLD, NEW))

          tests = Path("tests/test_ai_review_governance_hardening.py")
          test_text = tests.read_text()
          marker = 'def test_review_gate_namespace_rule_must_remain_effective(tmp_path: Path) -> None:\n'
          assert marker in test_text
          addition = r'''

def test_review_gate_rejects_indirect_ownerless_workflow_override(tmp_path: Path) -> None:
    _write_repository(tmp_path)
    codeowners = tmp_path / ".github" / "CODEOWNERS"
    codeowners.write_text(
        "/.github/workflows/** @repository-owner\n"
        "**/release-*.yml\n"
        "/.github/workflows/codex-review.yml @repository-owner\n"
        "/.github/CODEOWNERS @repository-owner\n",
        encoding="utf-8",
    )
    assert any("namespace rule" in item.message for item in _findings(tmp_path))


def test_review_gate_rejects_huge_timing_value_without_raising(tmp_path: Path) -> None:
    huge = "9" * 5000
    workflow = WORKFLOW.replace(
        "          mode: wait\n          request-label: codex:review\n",
        "          mode: wait\n          request-label: codex:review\n"
        f"          timeout-seconds: '{huge}'\n",
    )
    _write_repository(tmp_path, workflow)
    assert any("positive timing overrides" in item.message for item in _findings(tmp_path))


def test_review_gate_rejects_timing_above_runtime_bound(tmp_path: Path) -> None:
    workflow = WORKFLOW.replace(
        "          mode: wait\n          request-label: codex:review\n",
        "          mode: wait\n          request-label: codex:review\n"
        "          timeout-seconds: '2147483648'\n",
    )
    _write_repository(tmp_path, workflow)
    assert any("positive timing overrides" in item.message for item in _findings(tmp_path))


def test_review_gate_rejects_workflow_bash_env(tmp_path: Path) -> None:
    workflow = WORKFLOW.replace("permissions:\n  contents: read\n", "env:\n  BASH_ENV: /tmp/pwn\npermissions:\n  contents: read\n", 1)
    _write_repository(tmp_path, workflow)
    assert any("environment overrides" in item.message for item in _findings(tmp_path))


def test_review_gate_rejects_job_bash_env(tmp_path: Path) -> None:
    workflow = WORKFLOW.replace("    runs-on: ubuntu-latest\n", "    runs-on: ubuntu-latest\n    env:\n      BASH_ENV: /tmp/pwn\n", 1)
    _write_repository(tmp_path, workflow)
    assert any("environment overrides" in item.message for item in _findings(tmp_path))


def test_review_gate_rejects_step_bash_env(tmp_path: Path) -> None:
    workflow = WORKFLOW.replace("      - uses: ", "      - env:\n          BASH_ENV: /tmp/pwn\n        uses: ", 1)
    _write_repository(tmp_path, workflow)
    assert any("environment overrides" in item.message for item in _findings(tmp_path))
'''
          if "test_review_gate_rejects_indirect_ownerless_workflow_override" not in test_text:
              test_text = test_text.replace(marker, addition + "\n\n" + marker)
              tests.write_text(test_text)
          PY
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate
        shell: bash
        run: |
          ruff check .
          pytest
          python validator/validate_standard.py
          python -m ai_native validate fixtures/passing/library.yaml --root fixtures --format json
          bash -n actions/codex-review-gate/preflight.sh actions/codex-review-gate/codex-review-gate.sh
          python tools/discover_improvements.py --budget 20
          python -m build
          git diff --check
      - name: Push remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_native.py .github/workflows/codex-review.yml tests
          git commit -m 'fix: close final Codex governance findings'
          git push origin HEAD:align/codex-governance
