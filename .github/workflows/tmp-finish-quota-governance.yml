name: Finish quota-aware Codex governance

on:
  push:
    branches: [align/codex-governance]

permissions:
  contents: write

concurrency:
  group: finish-quota-aware-codex-governance
  cancel-in-progress: false

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OLD_REF: cd1f286222a286508c962288671c1f6c97b52d95
      NEW_REF: 6f365e9bfba6a44bc208e8acd778809fd7eb1c49
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize quota-aware governance
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          old = os.environ["OLD_REF"]
          new = os.environ["NEW_REF"]
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"],
              text=False,
          ).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode())
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")

          workflow = Path(".github/workflows/codex-review.yml")
          text = workflow.read_text(encoding="utf-8")
          text = text.replace(
              "types: [opened, synchronize, reopened, ready_for_review, edited]",
              "types: [opened, synchronize, reopened, ready_for_review, edited, labeled]",
          )
          workflow.write_text(text, encoding="utf-8")
          Path(".github/workflows/tmp-finish-quota-governance.yml").unlink()
          PY

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Validate canonical standard
        run: python validator/validate_standard.py

      - name: Validate consumer fixture
        run: >-
          python -m ai_native validate
          fixtures/consumer-repository/AI_NATIVE_PLATFORM.yaml
          --root fixtures/consumer-repository

      - name: Validate shell gate
        run: bash -n actions/codex-review-gate/codex-review-gate.sh

      - name: Build
        run: python -m build

      - name: Check diff
        run: git diff --check

      - name: Commit validated result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: conserve Codex review quota at merge-ready checkpoints"
          git push origin HEAD:align/codex-governance
