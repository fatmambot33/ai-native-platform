name: Temporary quota-aware Codex governance update

on:
  push:
    branches: [align/codex-governance]

permissions:
  contents: write
  issues: write

concurrency:
  group: tmp-quota-aware-codex-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch reusable gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          action = "actions/codex-review-gate/action.yml"
          replace(
              action,
              "description: Request or require Codex review evidence for a pull-request HEAD.",
              "description: Request or require current-HEAD Codex review evidence while conserving review quota.",
          )
          replace(
              action,
              "    description: GitHub token. Request mode needs issues:write; wait mode needs read permissions only.",
              "    description: GitHub token. Request mode needs issues:write; wait mode needs read permissions only.",
          )
          replace(
              action,
              "  timeout-seconds:\n",
              "  request-label:\n    description: One-shot label authorizing a quota-consuming Codex review request.\n    required: false\n    default: \"codex:review\"\n  timeout-seconds:\n",
          )
          replace(
              action,
              "        CODEX_REVIEW_MODE: ${{ inputs.mode }}\n",
              "        CODEX_REVIEW_MODE: ${{ inputs.mode }}\n        CODEX_REVIEW_REQUEST_LABEL: ${{ inputs.request-label }}\n",
          )

          gate = "actions/codex-review-gate/codex-review-gate.sh"
          replace(
              gate,
              ': "${GITHUB_WORKFLOW_REF:?GITHUB_WORKFLOW_REF is required}"\n\nMODE="${CODEX_REVIEW_MODE:-wait}"',
              ': "${GITHUB_WORKFLOW_REF:?GITHUB_WORKFLOW_REF is required}"\n: "${GITHUB_EVENT_NAME:?GITHUB_EVENT_NAME is required}"\n: "${GITHUB_EVENT_PATH:?GITHUB_EVENT_PATH is required}"\n\nMODE="${CODEX_REVIEW_MODE:-wait}"',
          )
          replace(
              gate,
              'POLL_SECONDS="${CODEX_REVIEW_POLL_SECONDS:-60}"\nSHORT_SHA=',
              'POLL_SECONDS="${CODEX_REVIEW_POLL_SECONDS:-60}"\nREQUEST_LABEL="${CODEX_REVIEW_REQUEST_LABEL:-codex:review}"\nSHORT_SHA=',
          )
          replace(
              gate,
              'WORKFLOW_PATH="${WORKFLOW_PATH%@*}"\n\nis_codex_login=',
              'WORKFLOW_PATH="${WORKFLOW_PATH%@*}"\nEVENT_ACTION="$(jq -r \'.action // empty\' "$GITHUB_EVENT_PATH")"\nEVENT_LABEL="$(jq -r \'.label.name // empty\' "$GITHUB_EVENT_PATH")"\n\nis_codex_login=',
          )

          api_block = '''api_list() {
            local endpoint="$1"
            gh api --paginate \\
              -H "Accept: application/vnd.github+json" \\
              "$endpoint" \\
              --jq '.[]' | jq -s '.'
          }
          '''
          helpers = api_block + '''
          is_request_label_event() {
            [[ "$GITHUB_EVENT_NAME" == "pull_request_target" \\
              && "$EVENT_ACTION" == "labeled" \\
              && "$EVENT_LABEL" == "$REQUEST_LABEL" ]]
          }

          is_wait_label_event() {
            [[ "$GITHUB_EVENT_NAME" == "pull_request" \\
              && "$EVENT_ACTION" == "labeled" \\
              && "$EVENT_LABEL" == "$REQUEST_LABEL" ]]
          }

          clear_request_label() {
            local encoded_label
            encoded_label="$(jq -rn --arg value "$REQUEST_LABEL" '$value | @uri')"
            if ! gh api --method DELETE \\
              "repos/${REPO}/issues/${PR_NUMBER}/labels/${encoded_label}" >/dev/null 2>&1; then
              echo "::warning::Unable to clear one-shot Codex review label ${REQUEST_LABEL}."
            fi
            return 0
          }
          '''
          replace(gate, api_block, helpers)

          current_workflow = '''current_workflow_id() {
            local run
            if ! run="$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}")"; then
              echo "::error::Unable to load the current governance workflow run."
              return 2
            fi
            jq -er '.workflow_id | tostring' <<<"$run" || {
              echo "::error::Current governance run is missing a workflow ID."
              return 2
            }
          }
          '''
          activation = current_workflow + '''
          head_activation_time() {
            local timeline active_since
            if ! timeline="$(api_list "repos/${REPO}/issues/${PR_NUMBER}/timeline?per_page=100")"; then
              echo "::error::Unable to query the pull-request timeline for HEAD activation."
              return 2
            fi
            active_since="$(
              jq -r \\
                --arg head "$HEAD_SHA" \\
                '[.[] | select((.event // "") == "committed" and (.sha // "") == $head) | .created_at] | last // empty' \\
                <<<"$timeline"
            )"
            if [[ -z "$active_since" || "$active_since" == "null" ]]; then
              echo "::error::Unable to prove when current HEAD ${SHORT_SHA} became active."
              return 2
            fi
            printf '%s\\n' "$active_since"
          }
          '''
          replace(gate, current_workflow, activation)

          old_bootstrap = '''find_bootstrap_trigger_comment() {
            local comments
            COMMENT_ID=""
            comments="$(api_list "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100")"
            COMMENT_ID="$(
              jq -r \\
                --arg marker "$MARKER" \\
                '[
                  .[]
                  | select(
                      (.author_association // "") == "OWNER"
                      or (.author_association // "") == "MEMBER"
                      or (.author_association // "") == "COLLABORATOR"
                    )
                  | select((.created_at // "") == (.updated_at // ""))
                  | select((.body // "") | test("^@codex review(\\\\r?\\\\n|$)"))
                  | select((.body // "") | contains($marker))
                ] | last | .id // empty' \\
                <<<"$comments"
            )"
          }
          '''
          new_bootstrap = '''find_bootstrap_trigger_comment() {
            local comments active_since
            COMMENT_ID=""
            if ! active_since="$(head_activation_time)"; then
              return 2
            fi
            comments="$(api_list "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100")"
            COMMENT_ID="$(
              jq -r \\
                --arg marker "$MARKER" \\
                --arg active_since "$active_since" \\
                '[
                  .[]
                  | select(
                      (.author_association // "") == "OWNER"
                      or (.author_association // "") == "MEMBER"
                      or (.author_association // "") == "COLLABORATOR"
                    )
                  | select((.created_at // "") == (.updated_at // ""))
                  | select((.created_at // "") >= $active_since)
                  | select((.body // "") | test("^@codex review(\\\\r?\\\\n|$)"))
                  | select((.body // "") | contains($marker))
                ] | last | .id // empty' \\
                <<<"$comments"
            )"
          }
          '''
          replace(gate, old_bootstrap, new_bootstrap)

          trigger = '''find_trigger_comment() {
            COMMENT_ID=""
            find_bot_trigger_comment
            if [[ -z "$COMMENT_ID" ]]; then
              find_bootstrap_trigger_comment
            fi
          }
          '''
          failure_helpers = trigger + '''
          latest_request_label_time() {
            local timeline labeled_since
            if ! timeline="$(api_list "repos/${REPO}/issues/${PR_NUMBER}/timeline?per_page=100")"; then
              echo "::error::Unable to query Codex review-label timing."
              return 2
            fi
            labeled_since="$(
              jq -r \\
                --arg label "$REQUEST_LABEL" \\
                '[.[] | select((.event // "") == "labeled" and (.label.name // "") == $label) | .created_at] | last // empty' \\
                <<<"$timeline"
            )"
            if [[ -z "$labeled_since" || "$labeled_since" == "null" ]]; then
              echo "::error::Unable to prove the current ${REQUEST_LABEL} label event."
              return 2
            fi
            printf '%s\\n' "$labeled_since"
          }

          codex_failure_after() {
            local since="$1"
            local comments body
            if ! comments="$(api_list "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100")"; then
              echo "::error::Unable to inspect Codex review-request failures."
              return 2
            fi
            body="$(
              jq -r \\
                --arg since "$since" \\
                "[
                  .[]
                  | select((${is_codex_login}))
                  | select((.created_at // \\\"\\\") >= \\$since)
                  | select(
                      ((.body // \\\"\\\") | contains(\\\"reached your Codex usage limits for code reviews\\\"))
                      or ((.body // \\\"\\\") | startswith(\\\"Codex Review: Something went wrong\\\"))
                    )
                  | .body
                ] | first // empty" \\
                <<<"$comments"
            )"
            [[ -n "$body" ]] || return 1
            if [[ "$body" == *"usage limits for code reviews"* ]]; then
              echo "::error::Codex code-review quota is unavailable. No automatic retry will be attempted; re-apply ${REQUEST_LABEL} after capacity returns."
            else
              echo "::error::Codex reported a review-request failure. No automatic retry will be attempted; re-apply ${REQUEST_LABEL} when ready."
            fi
            return 0
          }

          trigger_failure_for_comment() {
            local comment_id="$1"
            local comment created_at
            if ! comment="$(gh api "repos/${REPO}/issues/comments/${comment_id}")"; then
              echo "::error::Unable to load prior Codex review request ${comment_id}."
              return 2
            fi
            if ! created_at="$(jq -er '.created_at' <<<"$comment")"; then
              echo "::error::Prior Codex review request is missing its server timestamp."
              return 2
            fi
            codex_failure_after "$created_at"
          }
          '''
          replace(gate, trigger, failure_helpers)

          old_request = '''request_review() {
            find_bot_trigger_comment
            if [[ -n "$COMMENT_ID" ]]; then
              echo "Codex review request for current HEAD ${SHORT_SHA} already exists."
              return 0
            fi
            local body response
            body="$(printf '@codex review\\n\\nAutomated AI Native Platform merge gate for `%s`.\\n%s\\n%s\\n' "$SHORT_SHA" "$MARKER" "$RUN_MARKER")"
            response="$(
              gh api --method POST \\
                "repos/${REPO}/issues/${PR_NUMBER}/comments" \\
                -f body="$body"
            )"
            COMMENT_ID="$(jq -r '.id' <<<"$response")"
            echo "Requested Codex review for current HEAD ${SHORT_SHA}."
          }
          '''
          new_request = '''request_review() {
            find_bot_trigger_comment
            if [[ -n "$COMMENT_ID" ]]; then
              local failure_status
              if trigger_failure_for_comment "$COMMENT_ID"; then
                echo "Prior Codex request failed; the explicit ${REQUEST_LABEL} event permits one retry."
              else
                failure_status=$?
                if [[ "$failure_status" -eq 1 ]]; then
                  echo "A Codex review request for current HEAD ${SHORT_SHA} is still pending; not sending a duplicate and preserving quota."
                  return 0
                fi
                return 2
              fi
            fi
            local body response
            body="$(printf '@codex review\\n\\nQuota-aware merge-ready AI Native Platform gate for `%s`.\\n%s\\n%s\\n' "$SHORT_SHA" "$MARKER" "$RUN_MARKER")"
            response="$(
              gh api --method POST \\
                "repos/${REPO}/issues/${PR_NUMBER}/comments" \\
                -f body="$body"
            )"
            COMMENT_ID="$(jq -r '.id' <<<"$response")"
            echo "Requested one Codex review for merge-ready HEAD ${SHORT_SHA}."
          }
          '''
          replace(gate, old_request, new_request)

          old_tail = '''case "$MODE" in
            request)
              if has_matching_review; then
                echo "Codex already reviewed current HEAD ${SHORT_SHA}."
                exit 0
              fi
              request_review
              exit 0
              ;;
            wait)
              ;;
            *)
              echo "::error::Unknown Codex review gate mode: ${MODE}."
              exit 2
              ;;
          esac

          echo "Waiting for clean Codex evidence for current HEAD ${SHORT_SHA}."
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while (( SECONDS < deadline )); do
            if has_clear_codex_evidence; then
              echo "Codex review is current and all Codex review threads are resolved for ${SHORT_SHA}."
              exit 0
            fi
            sleep "$POLL_SECONDS"
          done

          echo "::error::Codex has not completed a clean, fully resolved review of current HEAD ${SHORT_SHA}."
          exit 1
          '''
          new_tail = '''case "$MODE" in
            request)
              if ! is_request_label_event; then
                echo "Codex review request skipped. Apply ${REQUEST_LABEL} only when the PR is merge-ready."
                exit 0
              fi
              trap clear_request_label EXIT
              if has_matching_review; then
                echo "Codex already reviewed current HEAD ${SHORT_SHA}."
                exit 0
              fi
              request_review
              exit 0
              ;;
            wait)
              ;;
            *)
              echo "::error::Unknown Codex review gate mode: ${MODE}."
              exit 2
              ;;
          esac

          if has_clear_codex_evidence; then
            echo "Codex review is current and all Codex review threads are resolved for ${SHORT_SHA}."
            exit 0
          fi

          if ! is_wait_label_event; then
            echo "::error::Current HEAD ${SHORT_SHA} has no clean Codex review. Run normal CI and batch fixes first, then apply ${REQUEST_LABEL} once the PR is merge-ready."
            exit 1
          fi

          label_since="$(latest_request_label_time)" || exit 2
          echo "Waiting for one merge-ready Codex review of current HEAD ${SHORT_SHA}."
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          while (( SECONDS < deadline )); do
            if has_clear_codex_evidence; then
              echo "Codex review is current and all Codex review threads are resolved for ${SHORT_SHA}."
              exit 0
            fi
            if codex_failure_after "$label_since"; then
              exit 1
            else
              failure_status=$?
              if [[ "$failure_status" -eq 2 ]]; then
                exit 2
              fi
            fi
            sleep "$POLL_SECONDS"
          done

          echo "::error::Codex has not completed a clean, fully resolved review of current HEAD ${SHORT_SHA}. Re-apply ${REQUEST_LABEL} only after checking whether the earlier request completed or failed."
          exit 1
          '''
          replace(gate, old_tail, new_tail)
          PY

          git rm .github/workflows/tmp-quota-aware-codex-fix.yml
          git add actions/codex-review-gate/action.yml actions/codex-review-gate/codex-review-gate.sh
          git commit -m "fix: make Codex review requests quota-aware"
          ACTION_SHA="$(git rev-parse HEAD)"
          echo "ACTION_SHA=${ACTION_SHA}" >> "$GITHUB_ENV"

      - name: Patch governance contract and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          action_sha = os.environ["ACTION_SHA"]
          old_ref = "cd1f286222a286508c962288671c1f6c97b52d95"

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          # Repin every repository reference to the immutable commit containing the new action.
          for target in Path(".").rglob("*"):
              if not target.is_file() or ".git" in target.parts:
                  continue
              try:
                  text = target.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if old_ref in text:
                  target.write_text(text.replace(old_ref, action_sha), encoding="utf-8")

          workflow = ".github/workflows/codex-review.yml"
          replace(
              workflow,
              "  pull_request:\n    types: [opened, synchronize, reopened, ready_for_review]\n  pull_request_target:\n    types: [opened, synchronize, reopened, ready_for_review]\n",
              "  pull_request:\n    types: [opened, synchronize, reopened, ready_for_review, labeled]\n  pull_request_target:\n    types: [labeled]\n",
          )
          replace(
              workflow,
              "    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false\n",
              "    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'codex:review' && github.event.pull_request.draft == false\n",
          )
          replace(
              workflow,
              "      - name: Request Codex review of current HEAD\n",
              "      - name: Request one merge-ready Codex review\n",
          )
          replace(
              workflow,
              "          mode: request\n",
              "          mode: request\n          request-label: codex:review\n",
          )
          replace(
              workflow,
              "          mode: wait\n",
              "          mode: wait\n          request-label: codex:review\n",
          )

          ai = "ai_native.py"
          replace(
              ai,
              '    required = {"opened", "synchronize", "reopened", "ready_for_review"}\n',
              '    required = {"opened", "synchronize", "reopened", "ready_for_review", "labeled"}\n',
          )
          marker = '''def _event_runs_on_review_dismissal(workflow: Mapping[Any, Any]) -> bool:
          '''
          helper = '''def _event_runs_only_on_label(workflow: Mapping[Any, Any], event_name: str) -> bool:
              """Return whether an event is restricted to label changes only."""
              events = _workflow_events_value(workflow)
              if not isinstance(events, Mapping) or event_name not in events:
                  return False
              config = events[event_name]
              if not isinstance(config, Mapping):
                  return False
              types = config.get("types")
              if isinstance(types, str):
                  return types == "labeled"
              if isinstance(types, Sequence) and not isinstance(types, (str, bytes)):
                  return {str(item) for item in types} == {"labeled"}
              return False


          ''' + marker
          replace(ai, marker, helper)

          marker = '''def _uses_review_wait_events(job: Mapping[str, Any]) -> bool:
          '''
          helper = '''def _uses_labeled_review_request(job: Mapping[str, Any]) -> bool:
              """Return whether the request job spends quota only for the one-shot review label."""
              condition = _normalize_condition(job.get("if"))
              event_guard = (
                  "github.event_name == 'pull_request_target' && github.event.action == 'labeled' "
                  "&& github.event.label.name == 'codex:review'"
              )
              draft_guard = f"{event_guard} && github.event.pull_request.draft == false"
              return condition in {event_guard, draft_guard}


          ''' + marker
          replace(ai, marker, helper)

          replace(
              ai,
              '        "mode": mode,\n',
              '        "mode": mode,\n        "request-label": "codex:review",\n',
          )

          old_events = '''    events = _workflow_events(workflow)
              for event_name in ("pull_request", "pull_request_target"):
                  if event_name not in events:
                      failures.append(f"missing {event_name} event")
                  elif not _event_runs_on_required_pr_activities(workflow, event_name):
                      failures.append(
                          f"{event_name} must run on opened, synchronize, reopened, and ready_for_review"
                      )
          '''
          new_events = '''    events = _workflow_events(workflow)
              if "pull_request" not in events:
                  failures.append("missing pull_request event")
              elif not _event_runs_on_required_pr_activities(workflow, "pull_request"):
                  failures.append(
                      "pull_request must run on opened, synchronize, reopened, ready_for_review, and labeled"
                  )
              if "pull_request_target" not in events:
                  failures.append("missing pull_request_target event")
              elif not _event_runs_only_on_label(workflow, "pull_request_target"):
                  failures.append("pull_request_target must run only on labeled events")
          '''
          replace(ai, old_events, new_events)
          replace(
              ai,
              '    if not _uses_event(request, "pull_request_target"):\n        failures.append("request job condition must canonically bind pull_request_target")\n',
              '    if not _uses_labeled_review_request(request):\n        failures.append("request job condition must bind only codex:review labeled events")\n',
          )

          tests = "tests/test_ai_review_governance_hardening.py"
          replace(
              tests,
              "on:\n  pull_request:\n  pull_request_target:\n  pull_request_review:\n",
              "on:\n  pull_request:\n    types: [opened, synchronize, reopened, ready_for_review, labeled]\n  pull_request_target:\n    types: [labeled]\n  pull_request_review:\n",
          )
          replace(
              tests,
              "    if: github.event_name == 'pull_request_target'\n",
              "    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'codex:review'\n",
          )
          replace(
              tests,
              "          mode: request\n",
              "          mode: request\n          request-label: codex:review\n",
          )
          replace(
              tests,
              "          mode: wait\n",
              "          mode: wait\n          request-label: codex:review\n",
          )
          replace(
              tests,
              '''def test_review_gate_requires_all_pr_head_activities(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace("  pull_request:\\n", "  pull_request:\\n    types: [synchronize]\\n", 1)
              _write_repository(tmp_path, workflow)
              assert any("opened, synchronize, reopened, and ready_for_review" in item.message for item in _findings(tmp_path))
          ''',
              '''def test_review_gate_requires_all_pr_head_activities(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace(
                  "    types: [opened, synchronize, reopened, ready_for_review, labeled]\\n",
                  "    types: [opened, synchronize, reopened, ready_for_review]\\n",
                  1,
              )
              _write_repository(tmp_path, workflow)
              assert any("opened, synchronize, reopened, ready_for_review, and labeled" in item.message for item in _findings(tmp_path))
          ''',
          )
          with Path(tests).open("a", encoding="utf-8") as handle:
              handle.write('''

          def test_review_gate_restricts_writable_target_to_review_label(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace(
                  "  pull_request_target:\\n    types: [labeled]\\n",
                  "  pull_request_target:\\n    types: [labeled, synchronize]\\n",
              )
              _write_repository(tmp_path, workflow)
              assert any("pull_request_target must run only on labeled" in item.message for item in _findings(tmp_path))


          def test_review_gate_requires_explicit_codex_review_label_condition(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace(
                  "github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'codex:review'",
                  "github.event_name == 'pull_request_target'",
              )
              _write_repository(tmp_path, workflow)
              assert any("codex:review labeled events" in item.message for item in _findings(tmp_path))
          ''')

          gate_tests = "tests/test_codex_review_gate.py"
          old_activation = '''def test_clean_reaction_request_must_postdate_current_head_activation() -> None:
              script = GATE.read_text(encoding="utf-8")
              bot = _function_body(script, "find_bot_trigger_comment")
              bootstrap = _function_body(script, "find_bootstrap_trigger_comment")

              assert ".pull_request.updated_at" in script
              assert 'select((.pull_request.head.sha // "") == $head)' in script
              for body in (bot, bootstrap):
                  assert '--arg active_since "$HEAD_ACTIVE_SINCE"' in body
                  assert 'select((.created_at // "") >= $active_since)' in body
          '''
          new_activation = '''def test_clean_reaction_request_must_postdate_current_head_activation() -> None:
              script = GATE.read_text(encoding="utf-8")
              bot = _function_body(script, "find_bot_trigger_comment")
              bootstrap = _function_body(script, "find_bootstrap_trigger_comment")
              activation = _function_body(script, "head_activation_time")

              assert '(.event // "") == "committed"' in activation
              assert '(.sha // "") == $head' in activation
              assert "trusted_request_run" in bot
              assert '--arg active_since "$active_since"' in bootstrap
              assert 'select((.created_at // "") >= $active_since)' in bootstrap
          '''
          replace(gate_tests, old_activation, new_activation)
          with Path(gate_tests).open("a", encoding="utf-8") as handle:
              handle.write('''

          def test_review_requests_are_explicit_one_shot_and_quota_aware() -> None:
              script = GATE.read_text(encoding="utf-8")
              request = _function_body(script, "request_review")

              assert 'REQUEST_LABEL="${CODEX_REVIEW_REQUEST_LABEL:-codex:review}"' in script
              assert "is_request_label_event" in script
              assert "clear_request_label" in script
              assert "still pending; not sending a duplicate" in request
              assert "explicit ${REQUEST_LABEL} event permits one retry" in request


