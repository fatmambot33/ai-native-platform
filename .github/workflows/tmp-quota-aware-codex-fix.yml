name: Temporary quota-aware Codex governance update

on:
  push:
    branches: [align/codex-governance]

permissions:
  contents: write
  issues: write

concurrency:
  group: tmp-quota-aware-codex-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make one-shot patcher tolerant of concurrent hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/tmp_quota_patch.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    old_tail = \'\'\'case "$MODE" in')
          new_start = text.index('    new_tail = \'\'\'case "$MODE" in', start)
          call = '    replace(gate, old_tail, new_tail)\n'
          call_start = text.index(call, new_start)
          call_end = call_start + len(call)
          new_definition = text[new_start:call_start]
          replacement = (
              new_definition
              + "    target = ROOT / gate\n"
              + "    gate_text = target.read_text(encoding='utf-8')\n"
              + "    tail_start = gate_text.index('case \\\"$MODE\\\" in')\n"
              + "    target.write_text(gate_text[:tail_start] + new_tail, encoding='utf-8')\n"
          )
          text = text[:start] + replacement + text[call_end:]
          text = text.replace(
              'run("git", "rm", ".github/scripts/tmp_quota_patch.py")',
              'run("git", "rm", "-f", ".github/scripts/tmp_quota_patch.py")',
          )

          helper = r'''
          def format_generated_tests() -> None:
              target = ROOT / "tests/test_ai_review_governance_hardening.py"
              generated = target.read_text(encoding="utf-8")
              generated = generated.replace(
                  "    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'codex:review'\n",
                  "    if: >-\n"
                  "      github.event_name == 'pull_request_target' &&\n"
                  "      github.event.action == 'labeled' &&\n"
                  "      github.event.label.name == 'codex:review'\n",
                  1,
              )
              generated = generated.replace(
                  '    assert any("opened, synchronize, reopened, ready_for_review, edited, and labeled" in item.message for item in _findings(tmp_path))\n',
                  '    assert any(\n'
                  '        "opened, synchronize, reopened, ready_for_review, edited, and labeled"\n'
                  '        in item.message\n'
                  '        for item in _findings(tmp_path)\n'
                  '    )\n',
                  1,
              )
              generated = generated.replace(
                  '    assert any("pull_request_target must run only on labeled" in item.message for item in _findings(tmp_path))\n',
                  '    assert any(\n'
                  '        "pull_request_target must run only on labeled" in item.message\n'
                  '        for item in _findings(tmp_path)\n'
                  '    )\n',
                  1,
              )
              function_start = generated.index(
                  "\ndef test_review_gate_requires_explicit_codex_review_label_condition"
              )
              generated = generated[:function_start] + r'''

          def test_review_gate_requires_explicit_codex_review_label_condition(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace(
                  "      github.event.label.name == 'codex:review'\n",
                  "      github.event.label.name == 'other'\n",
              )
              _write_repository(tmp_path, workflow)
              assert any(
                  "codex:review labeled events" in item.message for item in _findings(tmp_path)
              )
          '''
              target.write_text(generated, encoding="utf-8")


          '''
          text = text.replace('\ndef patch_docs() -> None:\n', helper + 'def patch_docs() -> None:\n', 1)
          text = text.replace(
              '    patch_tests()\n    patch_docs()\n',
              '    patch_tests()\n    format_generated_tests()\n    patch_docs()\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_ai_review_governance_hardening.py')
          source = tests.read_text(encoding='utf-8')
          current = '''def test_review_gate_requires_all_pr_head_activities(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace(
                  "  pull_request:\\n", "  pull_request:\\n    types: [synchronize]\\n", 1
              )
              _write_repository(tmp_path, workflow)
              assert any(
                  "opened, synchronize, reopened, ready_for_review, and edited" in item.message
                  for item in _findings(tmp_path)
              )
          '''
          normalized = '''def test_review_gate_requires_all_pr_head_activities(tmp_path: Path) -> None:
              workflow = WORKFLOW.replace("  pull_request:\\n", "  pull_request:\\n    types: [synchronize]\\n", 1)
              _write_repository(tmp_path, workflow)
              assert any("opened, synchronize, reopened, ready_for_review, and edited" in item.message for item in _findings(tmp_path))
          '''
          if current not in source:
              raise SystemExit('current lifecycle regression fixture not found')
          tests.write_text(source.replace(current, normalized, 1), encoding='utf-8')
          PY

      - name: Apply and validate quota-aware governance
        run: python .github/scripts/tmp_quota_patch.py
