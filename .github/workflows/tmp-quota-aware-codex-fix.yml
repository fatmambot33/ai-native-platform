name: Temporary quota-aware Codex governance update

on:
  push:
    branches: [align/codex-governance]

permissions:
  contents: write
  issues: write

concurrency:
  group: tmp-quota-aware-codex-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/codex-governance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and validate quota-aware governance
        run: python .github/scripts/tmp_quota_patch.py
