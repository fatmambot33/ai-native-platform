name: Apply base-revision hardening

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/apply-base-revision-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e .[dev]
      - name: Apply base-revision binding
        run: |
          python .github/scripts/apply_base_revision_hardening.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_ai_review_governance_hardening.py")
          text = path.read_text(encoding="utf-8").replace(
              "opened, synchronize, reopened, and ready_for_review",
              "opened, synchronize, reopened, ready_for_review, and edited",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_codex_review_gate.py")
          text = path.read_text(encoding="utf-8").replace(
              'assert ">= $since" in review',
              'assert "$since" in review',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate
        run: |
          python -m pytest -q
          python validator/validate_standard.py
      - name: Commit base-revision hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-base-revision-hardening.yml
          rm .github/scripts/apply_base_revision_hardening.py
          git add -A
          git commit -m "fix: bind AI review to base revision"
          git push origin HEAD:align/codex-governance
