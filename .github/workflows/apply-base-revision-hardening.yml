name: Apply base-revision hardening

on:
  push:
    branches: [align/codex-governance]
    paths:
      - .github/workflows/apply-base-revision-hardening.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: align/codex-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e .[dev]
      - name: Apply base-revision binding
        run: |
          python .github/scripts/apply_base_revision_hardening.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_ai_review_governance_hardening.py")
          text = path.read_text(encoding="utf-8").replace(
              "opened, synchronize, reopened, and ready_for_review",
              "opened, synchronize, reopened, ready_for_review, and edited",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_codex_review_gate.py")
          text = path.read_text(encoding="utf-8").replace(
              'assert ">= $since" in review',
              'assert "$since" in review',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate
        run: |
          python -m pytest -q
          python validator/validate_standard.py
      - name: Package validated files
        run: |
          tar -czf /tmp/base-revision-patch.tar.gz \
            actions/codex-review-gate/action.yml \
            actions/codex-review-gate/codex-review-gate.sh \
            .github/workflows/codex-review.yml \
            ai_native.py \
            tests/test_ai_review_governance_hardening.py \
            tests/test_validation.py \
            tests/test_codex_review_gate.py \
            docs/AI_REVIEW_GOVERNANCE.md \
            CHANGELOG.md \
            RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: validated-base-revision-patch
          path: /tmp/base-revision-patch.tar.gz
          if-no-files-found: error
