version: 1
standard:
  repository: fatmambot33/ai-native-platform
  ref: v0.3.0
product:
  name: example-product
  profile: library
  ai_native: true
  description: Replace with the product promise.
plugin:
  enabled: false
  codex:
    supported: false
    marketplace: false
  discovery:
    entry_points: false
    manifest: false
    capabilities: false
  credentials:
    required: false
    local_only: true
    policy:
      never_store_remote: true
      never_commit: true
      never_echo: true
interfaces:
  sdk: true
  cli: false
  plugin: false
  json_schema: true
  openapi: false
quality:
  typed: true
  tests: true
  docs: true
  examples: true
  compatibility: true
  security_scan: true
release:
  block_if_quality_fails: true
  block_if_plugin_invalid: true
agent:
  guarantees:
    - deterministic_tool_discovery
    - structured_outputs
    - issue_driven_improvement
    - ci_validated_changes
    - governed_autonomy
self_improvement:
  enabled: true
  github:
    issues: true
  autonomous:
    discover_improvements: true
    create_issues: true
    generate_pr: true
    run_ci: true
  governance:
    human_approval:
      breaking_changes: true
      security_changes: true
      credential_changes: true
      public_api_changes: true
      permission_expansion: true
      release_changes: true
evidence:
  mode: repository
  paths:
    readme: README.md
    tests: tests
    agent_instructions: AGENTS.md
    typing: pyproject.toml
    ci: .github/workflows/quality.yml
    sdk: src
    schemas: schemas
    docs: docs
    examples: examples
    # The protected validation workflow should invoke the framework's Codex current-HEAD review gate.
    ai_review_workflow: .github/workflows/validate.yml
    # May point to a security workflow or a document proving native GitHub CodeQL, default setup, or ruleset enforcement.
    security_evidence: .github/SECURITY_ENFORCEMENT.md
    self_improvement_workflow: .github/workflows/self-improve.yml
    improvement_issue_template: .github/ISSUE_TEMPLATE/ai-improvement.yml
